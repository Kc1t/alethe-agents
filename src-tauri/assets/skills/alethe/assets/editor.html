<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alethe Playbooks</title>
<style>
:root {
  --bg: #101114;
  --bg-elevated: #1f2125;
  --bg-sunken: #1a1c1f;
  --panel: #2a2d33;
  --panel-hover: #34373e;
  --border: #2a2d33;
  --border-strong: rgba(243, 244, 246, 0.22);
  --fg: #f3f4f6;
  --fg-muted: #c8c8d0;
  --text-tertiary: #8b8b95;
  --text-quaternary: #6b6b75;
  --accent: #f3f4f6;
  --accent-soft: rgba(243, 244, 246, 0.06);
  --accent-border: rgba(243, 244, 246, 0.22);
  --ok: #10b981;
  --warn: #f59e0b;
  --danger: #ef4444;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;
  --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'Caskaydia Cove Nerd Font Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace;
  --canvas: var(--bg);
  --surface: var(--bg-elevated);
  --surface-2: var(--bg-sunken);
  --surface-3: var(--panel);
  --muted: var(--text-tertiary);
  --line: var(--text-quaternary);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-sans); font-size: 12px; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; }
.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); grid-template-rows: 32px minmax(0, 1fr); height: 100vh; }
.app.with-panel { grid-template-columns: 224px minmax(0, 1fr) 320px; }
.titlebar { grid-column: 1 / -1; height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 8px 0 11px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); min-width: 0; user-select: none; }
.titlebar .logo { width: 16px; height: 16px; display: block; border-radius: 4px; }
.titlebar .app-name { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; }
.titlebar .crumb { font-size: 12px; color: var(--text-quaternary); }
.titlebar .crumb-label { font-size: 12px; color: var(--text-tertiary); }
.titlebar .crumb-current { font-size: 12px; color: var(--fg-muted); white-space: nowrap; }
.titlebar .edited { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.titlebar .edited[hidden] { display: none; }
.spacer { flex: 1; }
.create-btn { height: 24px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--fg-muted); background: var(--bg-sunken); font-size: 10px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.create-btn:hover, .create-btn[aria-pressed="true"] { color: var(--fg); background: var(--panel-hover); border-color: var(--border-strong); }
.sidebar { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--bg); }
.side-header { display: flex; align-items: center; justify-content: space-between; min-height: 34px; padding: 0 12px; border-bottom: 1px solid var(--border); gap: 8px; }
.side-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-muted); }
.count { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); padding: 1px 6px; border-radius: 999px; background: var(--bg-elevated); border: 1px solid var(--border); }
.side-list { flex: 1; min-height: 0; overflow: auto; padding: 8px; }
.group { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 4px; margin-bottom: 8px; }
.group-title { display: flex; align-items: center; gap: 6px; padding: 5px 6px 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); }
.group-title .dot { width: 6px; height: 6px; border-radius: 50%; }
.wf { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 26px; padding: 3px 6px; border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--fg-muted); font: 12px var(--font-sans); text-align: left; cursor: pointer; }
.wf:hover { background: var(--accent-soft); color: var(--fg); }
.wf[aria-current="true"] { background: var(--panel); color: var(--fg); font-weight: 600; }
.wf .chip { width: 14px; height: 14px; border-radius: 3px; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: #101114; flex-shrink: 0; }
.wf .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wf .n { font: 10px var(--font-mono); color: var(--text-quaternary); }
.wf .edited-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--warn); flex-shrink: 0; }
.side-footer { border-top: 1px solid var(--border); }
.footer-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 0 12px; }
.footer-label { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--bg); }
.canvas-wrap { position: absolute; inset: 0; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#canvas.panning { cursor: grabbing; }
#canvas .node { cursor: pointer; }
.scenario-bar, .zoom { position: absolute; display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius-md); background: color-mix(in srgb, var(--bg) 82%, transparent); }
.scenario-bar { top: 12px; left: 12px; }
.scenario-bar label { display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 2px 0 8px; font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); white-space: nowrap; }
.scenario-bar select { width: auto; height: 22px; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--fg); font: 10px var(--font-mono); padding: 0 2px; cursor: pointer; letter-spacing: 0; text-transform: none; }
.scenario-bar select:hover { background: var(--panel-hover); border-color: transparent; }
.scenario-bar .divider { width: 1px; height: 14px; background: var(--border); }
.zoom { left: 12px; bottom: 12px; }
.zoom button { width: 26px; height: 22px; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--text-tertiary); font: 12px var(--font-mono); cursor: pointer; }
.zoom button:hover { color: var(--fg); background: var(--panel-hover); }
.drawer { position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: var(--bg-elevated); border-top: 1px solid var(--border); display: flex; flex-direction: column; }
.drawer[hidden] { display: none; }
.drawer header { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.drawer header b { font: 600 11px var(--font-mono); }
.drawer header span { color: var(--text-tertiary); font-size: 11px; }
.drawer pre { margin: 0; padding: 12px 14px; overflow: auto; flex: 1; font: 11.5px/1.6 var(--font-mono); color: var(--fg-muted); }
.panel { border-left: 1px solid var(--border); background: var(--bg); overflow: auto; }
.panel[hidden] { display: none; }
.panel-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; min-height: 34px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
.panel-head button { width: 24px; height: 24px; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; color: var(--text-tertiary); font-size: 15px; line-height: 1; cursor: pointer; }
.panel-head button:hover { color: var(--fg); background: var(--panel-hover); }
.panel-body { padding: 12px; }
.wf .ico { width: 16px; height: 16px; display: grid; place-items: center; color: var(--text-tertiary); flex-shrink: 0; }
.wf:hover .ico, .wf[aria-current="true"] .ico { color: var(--fg); }
.wf .ico img { width: 13px; height: 13px; object-fit: contain; }
.wf .via { width: 11px; height: 11px; object-fit: contain; }
.group-title .group-note { margin-left: auto; font: 500 10px var(--font-mono); letter-spacing: 0; text-transform: lowercase; color: var(--text-quaternary); }
.usage { position: relative; display: inline-flex; align-items: center; gap: 6px; }
.usage-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 2px 8px; border: 0; border-radius: 8px; background: var(--bg-sunken); color: var(--pill-color, var(--fg-muted)); font: 11px var(--font-mono); cursor: pointer; }
.usage-pill:hover { background: var(--panel-hover); }
.usage { gap: 4px; }
.usage-pill { gap: 5px; padding: 2px 7px; box-shadow: inset 0 0 0 1px var(--border); }
.usage-pill[aria-pressed="true"] { background: var(--panel-hover); box-shadow: inset 0 0 0 1px var(--border-strong); }
.usage-pill.unread { box-shadow: none; outline: 1px dashed var(--border-strong); outline-offset: -1px; }
.usage-pill.route { color: var(--text-tertiary); }
.usage-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
.usage-pill .dot.spare { background: var(--ok); }
.usage-pill .dot.low { background: var(--danger); }
.profiles { display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--border); border-radius: var(--radius-md); background: color-mix(in srgb, var(--bg) 78%, transparent); }
.profiles button { height: 22px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent; border-radius: var(--radius-sm); padding: 0 8px; background: transparent; color: var(--text-tertiary); font: 10.5px var(--font-mono); cursor: pointer; }
.profiles button .ico { width: 13px; height: 13px; display: grid; place-items: center; }
.profiles button:hover { color: var(--fg); background: var(--panel-hover); }
.profiles button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent-border); background: var(--accent-soft); }
.usage-pill img, .usage-popover img { width: 13px; height: 13px; object-fit: contain; }
.usage-pill .sep { color: var(--text-quaternary); }
.usage-pill .spare { color: var(--ok); font-size: 10px; }
.usage-popover { position: absolute; top: calc(100% + 7px); right: 0; z-index: 20; width: 300px; padding: 10px 12px 12px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--bg-elevated); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28); }
.usage-popover .title { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 700; margin-bottom: 8px; }
.usage-popover .tabs { display: flex; gap: 2px; }
.usage-popover .tabs button { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid transparent; border-radius: var(--radius-sm); background: transparent; cursor: pointer; opacity: 0.5; }
.usage-popover .tabs button:hover { opacity: 0.85; background: var(--panel-hover); }
.usage-popover .tabs button[aria-pressed="true"] { opacity: 1; border-color: var(--accent-border); background: var(--accent-soft); }
.usage-popover .unread-note { margin: 0 0 6px; font-size: 10px; line-height: 1.4; color: var(--warn); }
.usage-popover .presets { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.usage-popover .presets button { height: 20px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: transparent; color: var(--text-tertiary); font: 10px var(--font-mono); padding: 0 6px; cursor: pointer; }
.usage-popover .presets button:hover { color: var(--fg); background: var(--panel-hover); }
.usage-popover .presets button[aria-pressed="true"] { color: var(--fg); border-color: var(--accent-border); background: var(--accent-soft); }
.usage-popover .provider { display: flex; align-items: center; gap: 6px; margin: 12px 0 4px; font-size: 11px; font-weight: 600; }
.usage-popover .provider .state { margin-left: auto; font: 10px var(--font-mono); }
.usage-popover .provider .state.low { color: var(--danger); }
.usage-popover .provider .state.spare { color: var(--ok); }
.usage-popover .line { display: grid; grid-template-columns: 56px 1fr 38px; align-items: center; gap: 8px; height: 22px; font: 11px var(--font-mono); color: var(--fg-muted); }
.usage-popover .meta { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 8px; height: 26px; font: 11px var(--font-mono); color: var(--fg-muted); }
.usage-popover .meta select { height: 22px; padding: 0 6px; font: 11px var(--font-mono); }
.usage-popover input[type="range"] { width: 100%; height: 14px; margin: 0; accent-color: var(--fg); }
.usage-popover .val { text-align: right; color: var(--fg); }
.usage-popover .val.hot { color: var(--danger); }
.usage-popover .why { margin: 2px 0 0 64px; font-size: 10px; line-height: 1.4; color: var(--ok); }
.usage-popover .foot { margin-top: 10px; font-size: 10px; color: var(--text-tertiary); line-height: 1.4; }
.panel h2 { font-size: 14px; font-weight: 600; margin: 3px 0 2px; }
.panel .kind { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); }
.panel .hint { color: var(--fg-muted); font-size: 12px; margin: 6px 0 12px; line-height: 1.5; }
.panel a { color: var(--fg); }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 11.5px; margin-bottom: 12px; }
.facts dt { color: var(--text-tertiary); }
.facts dd { margin: 0; line-height: 1.45; color: var(--fg-muted); }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; min-width: 0; }
.field > span { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); }
input[type="text"], input[type="number"], input[type="date"], select, textarea { height: 28px; background: var(--bg-sunken); color: var(--fg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 8px; font: 12px var(--font-sans); width: 100%; min-width: 0; }
input[type="date"] { color-scheme: dark; }
input:hover, select:hover, textarea:hover { border-color: var(--border-strong); }
textarea { height: auto; min-height: 70px; padding: 6px 8px; resize: vertical; line-height: 1.45; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; min-width: 0; }
.row.wide-first > :first-child { flex: 2; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.checks label { display: inline-flex; gap: 5px; align-items: center; height: 24px; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 8px; font-size: 11px; color: var(--fg-muted); background: var(--bg-sunken); cursor: pointer; }
.section { border-top: 1px solid var(--border); margin-top: 12px; padding-top: 12px; }
.section h4 { margin: 0 0 8px; font-size: 11px; font-weight: 500; letter-spacing: 1.4px; text-transform: uppercase; color: var(--text-tertiary); }
.cards { display: flex; flex-direction: column; gap: 8px; }
.card { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 10px; background: var(--bg-sunken); }
.card header { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.card header b { font: 600 11px var(--font-mono); }
.mini { display: flex; gap: 3px; }
.mini button { height: 20px; background: transparent; border: 1px solid var(--border); color: var(--text-tertiary); border-radius: var(--radius-sm); padding: 0 6px; cursor: pointer; font: 10px var(--font-mono); }
.mini button:hover { color: var(--fg); background: var(--panel-hover); }
.conds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.conds select { width: auto; flex: 1 1 140px; }
.conds .and { color: var(--text-tertiary); font: 10px var(--font-mono); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.btn { height: 24px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--fg-muted); background: var(--bg-sunken); font-size: 10px; font-weight: 650; cursor: pointer; white-space: nowrap; }
.btn:hover { color: var(--fg); background: var(--panel-hover); border-color: var(--border-strong); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.trace { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; color: var(--text-tertiary); line-height: 1.5; }
.trace b { color: var(--fg); font-weight: 600; }
.trace .warn { color: var(--warn); }
.trace .ok { color: var(--ok); }
.trace .danger { color: var(--danger); }
.tiers { width: 100%; border-collapse: collapse; font-size: 11px; }
.tiers th { text-align: left; color: var(--text-tertiary); font-weight: 500; padding: 4px; font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
.tiers td { padding: 3px 4px; color: var(--fg-muted); }
.tiers select { height: 24px; padding: 0 6px; font: 11px var(--font-mono); }
.tiers .tier-row { cursor: pointer; }
.tiers .tier-row:hover td { background: var(--accent-soft); }
.tiers td { vertical-align: top; padding: 5px 4px; }
.tiers .tm { display: block; font: 10.5px var(--font-mono); color: var(--fg-muted); overflow-wrap: anywhere; }
.tiers .te { display: block; font: 10px var(--font-mono); color: var(--text-quaternary); }
.prov { display: inline-flex; align-items: center; gap: 6px; }
.prov img { width: 12px; height: 12px; object-fit: contain; }
.plan-row { display: grid; grid-template-columns: 104px 1fr; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 11.5px; color: var(--fg-muted); }
.panel h2.with-mark { display: flex; align-items: center; gap: 8px; }
.panel h2.with-mark img { width: 16px; height: 16px; object-fit: contain; }
.panel .hint.note { margin: 0 0 6px; font-size: 11.5px; color: var(--text-tertiary); }
.gallery { max-width: 1080px; margin: 0 auto; padding: 32px 16px 80px; font-family: var(--font-sans, system-ui, sans-serif); }
.gallery h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
.gallery .sub { color: var(--text-tertiary, #8b8b95); font-size: 12px; margin: 0 0 20px; }
.gallery section { border-top: 1px solid var(--border, #2a2d33); padding: 20px 0 26px; }
.gallery h2 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
.gallery section p { margin: 0 0 14px; color: var(--fg-muted, #c8c8d0); font-size: 12px; }
@media (max-width: 1150px) {
  .app, .app.with-panel { grid-template-columns: 0 minmax(0, 1fr) 300px; }
  .sidebar { display: none; }
}
.load-error { position: fixed; top: 44px; left: 50%; z-index: 30; transform: translateX(-50%); max-width: min(640px, calc(100vw - 32px)); padding: 8px 12px; border: 1px solid var(--danger); border-radius: var(--radius-md); background: var(--bg-elevated); color: var(--fg); font-size: 12px; line-height: 1.45; }
</style>
</head>
<body>

<script>
const YAML_MAX_DEPTH = 100
const hasKey = (obj, key) => Object.prototype.hasOwnProperty.call(obj, key)
function parsePlaybooksYaml(text) {
  const fail = (line, message) => { throw new Error(`line ${line}: ${message}`) }
  const space = (ch) => ch !== undefined && /\s/.test(ch)
  const isItem = (t) => t === '-' || t.startsWith('- ')
  const isQuote = (ch) => ch === '"' || ch === "'"
  const ESCAPES = { 0: '\0', a: '\x07', b: '\b', t: '\t', n: '\n', v: '\v', f: '\f', r: '\r', e: '\x1b', ' ': ' ', '"': '"', '/': '/', '\\': '\\', N: '\x85', _: '\xa0', L: '\u2028', P: '\u2029' }
  const put = (target, key, value, line) => {
    if (key === '__proto__') fail(line, 'the key __proto__ is reserved')
    if (hasKey(target, key)) fail(line, `duplicate mapping key '${key}'`)
    target[key] = value
  }
  function uncomment(s) {
    let quote = null
    let previous = ''
    for (let i = 0; i < s.length; i++) {
      const ch = s[i]
      if (quote) {
        if (ch === '\\' && quote === '"') { i++; continue }
        if (ch === quote) {
          if (quote === "'" && s[i + 1] === "'") { i++; continue }
          quote = null
        }
      } else if (ch === '#' && (i === 0 || space(s[i - 1]))) return s.slice(0, i)
      else if (isQuote(ch) && (!previous || ':,[{-'.includes(previous))) quote = ch
      if (!space(ch)) previous = ch
    }
    return s
  }
  const lines = []
  text.split(/\r\n|\r|\n/).forEach((raw, n) => {
    const indent = raw.length - raw.replace(/^[ \t]+/, '').length
    if (raw.slice(0, indent).includes('\t')) fail(n + 1, 'tabs are not supported for indentation')
    const content = uncomment(raw.slice(indent)).trimEnd()
    if (content) lines.push([n + 1, indent, content])
  })
  let index = 0
  function quoted(s, start, line) {
    const quote = s[start]
    let out = ''
    let i = start + 1
    while (i < s.length) {
      const ch = s[i]
      if (ch === quote) {
        if (quote === "'" && s[i + 1] === "'") { out += "'"; i += 2; continue }
        return [out, i + 1]
      }
      if (ch === '\\' && quote === '"') {
        i++
        if (i === s.length) fail(line, 'unfinished quoted escape')
        const escape = s[i]
        if ('xuU'.includes(escape)) {
          const count = { x: 2, u: 4, U: 8 }[escape]
          const digits = s.slice(i + 1, i + 1 + count)
          if (digits.length !== count || !/^[0-9a-fA-F]+$/.test(digits)) fail(line, 'invalid Unicode escape')

          toEnd.push({ id: qg, out: 0, side: 'bottom', label: 'yes', kind: 'fail', drop: true })

        else edges.push({ from: `phase:${last.id}`, fromSide: 'top', to: gid, toSide: 'top', kind: 'recheck', label: 're-check' })

  nodes.push(terminal('end', 'end', 0, y + 20, 'Result', pb.next ? `then ${pb.next}` : null))
  connect(prev, 'end')
  toEnd.forEach((t) => edges.push({ from: t.id, out: t.out, fromSide: t.side, to: 'end', toSide: t.lane || t.drop ? 'right' : 'top', label: t.label, kind: t.kind, lane: t.lane }))

function routingGraph(wf, c) {
  const nodes = []
  const edges = []
  const byName = Object.fromEntries(wf.roles.map((r) => [r.name, r]))
  const sideX = DIA_W / 2 + SIDE_GAP + CARD_W / 2
  const roleInfo = (name) => {
    const r = byName[name]
    const { resolved, alts } = resolveRoutingRole(wf, r, c)
    return { title: name, lead: false, readOnly: r.readOnly, workers: 1, isolate: false, runner: null, tier: null, resolved, alts, ref: { kind: 'role', name } }
  }
  nodes.push({ id: 'start', type: 'start', x: 0, y: 0, w: 0, h: 0, cx: 0, cy: 0 })
  nodes.push({ id: 'entry', type: 'entry', ...card('entry', 0, CARD_H / 2, {}), type: 'entry', title: 'planner' })
  let y = CARD_H + V_GAP
  edges.push({ from: 'start', fromSide: 'bottom', to: 'entry', toSide: 'top' })
  let prev = [{ id: 'entry', side: 'bottom' }]
  const placed = {}
  const exits = []
  wf.rules.forEach((r, i) => {
    if (!byName[r.role]) return
    const isElse = i === wf.rules.length - 1 && !r.kinds.length && !r.efforts.length && !r.gates.length
    const cardId = `role:${r.role}`
    if (isElse) {
      if (!placed[r.role]) {
        const cy = y + CARD_H / 2
        nodes.push(card(cardId, 0, cy, roleInfo(r.role)))
        placed[r.role] = 'spine'
        y = cy + CARD_H / 2 + V_GAP
      }
      prev.forEach((src) => edges.push({ from: src.id, out: src.out, fromSide: src.side, to: cardId, toSide: placed[r.role] === 'spine' ? 'top' : 'bottom', label: src.label }))
      prev = placed[r.role] === 'spine' ? [{ id: cardId, side: 'bottom' }] : []
      return
    }
    const did = `dec:${i}`
    const cy = y + DIA_H / 2
    const question = `${taskRuleName(r)}${r.gates.length ? ` while ${gateName(r.gates[0])}` : ''}`
    nodes.push(diamond(did, 0, cy, asQuestion(question), {
      ref: { kind: 'routing-rules' }, labels: ['no', 'yes'],
      evaluate: (ctx) => {
        const closed = r.gates.some((g) => usageOf(g.agent, g.window) >= g.below)
        if (closed) return new Set([0])
        if (ctx.all) return new Set([0, 1])
        const matches = (!r.kinds.length || r.kinds.includes(ctx.task.kind)) && (!r.efforts.length || r.efforts.includes(ctx.task.effort))
        return new Set(matches ? [1] : [0])
      },
    }))
    prev.forEach((src) => edges.push({ from: src.id, out: src.out, fromSide: src.side, to: did, toSide: 'top', label: src.label }))
    if (!placed[r.role]) {
      nodes.push(card(cardId, sideX, cy, roleInfo(r.role)))
      placed[r.role] = 'side'
      exits.push(cardId)
      edges.push({ from: did, out: 1, fromSide: 'right', to: cardId, toSide: 'left', label: 'yes' })
    } else {
      edges.push({ from: did, out: 1, fromSide: 'right', to: cardId, toSide: 'bottom', label: 'yes', climb: true })
    }
    prev = [{ id: did, out: 0, side: 'bottom', label: 'no' }]
    y = cy + DIA_H / 2 + V_GAP
  })
  nodes.push(terminal('end', 'end', 0, y + 20, 'Result'))
  prev.forEach((src) => edges.push({ from: src.id, out: src.out, fromSide: src.side, to: 'end', toSide: 'top', label: src.label }))
  exits.forEach((id) => edges.push({ from: id, fromSide: 'right', to: 'end', toSide: 'right', lane: true }))
  return { nodes, edges }
}

const PROBLEM_TOKEN = new RegExp(`^(budget-low|spent-above:\\d+(\\.\\d+)?|both-low|all-low|(${PID})-(low|spare)|(${PID})(-[a-z0-9]+)?-above:\\d+)$`)
const isSpareCond = (cond) => condList(cond).some((token) => /-spare$/.test(token))
function isProblemCond(cond) {

}
const GHOST_W = 200
const GHOST_H = 40
const GHOST_GAP = 34
function addGhosts(graph) {
  const ghosts = []
  graph.nodes.filter((n) => n.type === 'role' && !n.lead).forEach((n) => {
    const spent = n.resolved?.spent
    const alts = (n.alts ?? []).filter((alt) => (alt.implicit ? !spent : alt.key === 'fallback' || isProblemCond(alt.cond)))
    if (spent) alts.push({ key: 'spare', spare: true, cond: [`${spent}-spare`], use: n.resolved.final })
    if (!alts.length) return
    const side = n.cx > 1 ? 'right' : 'left'
    const total = alts.length * GHOST_H + (alts.length - 1) * 8
    alts.forEach((alt, i) => {
      const x = side === 'left' ? n.x - GHOST_GAP - GHOST_W : n.x + n.w + GHOST_GAP
      const y = n.cy - total / 2 + i * (GHOST_H + 8)
      ghosts.push({ id: `${n.id}~fallback${i}`, type: 'ghost', parent: n.id, side, alt, x, y, w: GHOST_W, h: GHOST_H, cx: x + GHOST_W / 2, cy: y + GHOST_H / 2 })
    })
  })
  graph.nodes.push(...ghosts)
}

function buildGraph(wf = wfNow()) {
  const c = context()
  const graph = wf.kind === 'playbook' ? playbookGraph(wf, c) : routingGraph(wf, c)
  graph.nodes.forEach((n) => {
    const p = wf.positions[n.id]
    if (p) { n.x = p.x; n.y = p.y; n.cx = p.x + n.w / 2; n.cy = p.y + n.h / 2 }
  })
  addGhosts(graph)
  graph.byId = Object.fromEntries(graph.nodes.map((n) => [n.id, n]))
  graph.sim = simulate(graph, c)
  return graph
}

function simulate(graph, c) {
  const outgoing = {}
  graph.edges.forEach((e, i) => (outgoing[e.from] ??= []).push(i))
  const reached = new Set(['start'])
  const edgeOn = new Set()
  const queue = ['start']
  const openOf = {}
  while (queue.length) {
    const id = queue.shift()
    const n = graph.byId[id]
    let open = null
    if (n.type === 'decision') open = n.gate ? new Set((n.chain ? c.failedTwice : c.failed) ? [0, 1] : [0]) : n.evaluate(c)
    openOf[id] = open
    for (const i of outgoing[id] ?? []) {
      const e = graph.edges[i]
      if (open && e.out !== undefined && !open.has(e.out)) continue
      if (e.kind === 'recheck' && !c.failed) continue
      if (e.kind === 'fail' && e.cond && evalCond(e.cond, { ...c, subject: e.subject }) === false) continue
      edgeOn.add(i)
      if (!reached.has(e.to)) { reached.add(e.to); queue.push(e.to) }
    }
  }
  const bothLow = activeOrder().every((p) => c.low.includes(p))
  return { reached, edgeOn, openOf, bothLow, blocked: bothLow && Q().onBothCritical === 'block', c }

function port(n, side) {
  if (side === 'top') return [n.cx, n.y]
  if (side === 'bottom') return [n.cx, n.y + n.h]
  if (side === 'left') return [n.x, n.cy]
  return [n.x + n.w, n.cy]
}
function rounded(points, radius = 26) {
  let d = `M${f(points[0][0])} ${f(points[0][1])}`
  for (let i = 1; i < points.length - 1; i++) {
    const [px, py] = points[i - 1]
    const [x, y] = points[i]
    const [nx, ny] = points[i + 1]
    const inLen = Math.hypot(x - px, y - py)
    const outLen = Math.hypot(nx - x, ny - y)
    const r = Math.min(radius, inLen / 2, outLen / 2)
    const ax = x - ((x - px) / (inLen || 1)) * r
    const ay = y - ((y - py) / (inLen || 1)) * r
    const bx = x + ((nx - x) / (outLen || 1)) * r
    const by = y + ((ny - y) / (outLen || 1)) * r
    d += ` L${f(ax)} ${f(ay)} Q${f(x)} ${f(y)} ${f(bx)} ${f(by)}`
  }
  const [lx, ly] = points[points.length - 1]
  return `${d} L${f(lx)} ${f(ly)}`
}
function route(e, graph, laneX) {
  const a = graph.byId[e.from]
  const b = graph.byId[e.to]
  const p1 = port(a, e.fromSide)
  const p2 = port(b, e.toSide)
  if (e.lane) {
    const [bx, by] = port(a, 'bottom')
    const below = by + 26
    return [[bx, by], [bx, below], [laneX, below], [laneX, p2[1]], p2]
  }
  if (e.fromSide === 'bottom' && e.toSide === 'right') return [p1, [p1[0], p2[1]], p2]
  if (e.fromSide === 'right' && e.toSide === 'bottom') return [p1, [p2[0], p1[1]], p2]
  if (e.fromSide === 'top' && e.toSide === 'top') {
    const top = Math.min(p1[1], p2[1]) - 36
    return [p1, [p1[0], top], [p2[0], top], p2]

  if (e.fromSide === 'right' && e.toSide === 'left') {

    const mid = (p1[0] + p2[0]) / 2
    return [p1, [mid, p1[1]], [mid, p2[1]], p2]
  }
  if (Math.abs(p1[0] - p2[0]) < 1) return [p1, p2]
  const turn = p2[1] - 34
  return [p1, [p1[0], turn], [p2[0], turn], p2]
}
function arrowHead(parent, points, color) {

  const [px, py] = points[points.length - 2]
  const angle = Math.atan2(y - py, x - px)

  const spread = 4.5
  const bx = x - size * Math.cos(angle)
  const by = y - size * Math.sin(angle)

function rng(seed) {

function drawEdge(layer, e, on, graph, laneX) {

  const len = Math.hypot(end[0] - prev[0], end[1] - prev[1]) || 1

  const color = !on ? s.idle : blocked ? s.danger : special ? s.warn : s.on

    d = rounded(points.map(([x, y], i) => (i === 0 || i === points.length - 1 ? [x, y] : [x + (rand() - 0.5) * 6, y + (rand() - 0.5) * 6])), 14)

  const g = el('g', { class: 'node', 'data-id': n.id, opacity: reached ? 1 : 0.36 }, layer)
  el('rect', { x: n.x, y: n.y, width: n.w, height: n.h, rx: n.h / 2, fill: s.card, stroke: blocked ? s.danger : s.border, 'stroke-width': 1.3 }, g)
  txt(g, n.cx, n.cy + 4.5, blocked ? 'Blocked' : n.title, { 'font-size': 13, 'font-weight': 700, 'text-anchor': 'middle', fill: blocked ? s.danger : s.text })
  const sub = blocked ? 'both providers low' : n.subtitle
  if (sub) txt(layer, n.cx, n.y + n.h + 16, sub, { 'font-size': 10.5, fill: blocked ? s.danger : s.muted, 'text-anchor': 'middle' })
}

const wfNow = () => workflows[state.wf]
let currentGraph = null

function paint(viewport, graph) {
  viewport.replaceChildren()
  const edgeLayer = el('g', {}, viewport)
  const linkLayer = el('g', {}, viewport)
  const nodeLayer = el('g', {}, viewport)
  const right = Math.max(...graph.nodes.map((n) => n.x + n.w))
  let lane = 0
  graph.edges.forEach((e, i) => { if (e.from !== 'start') drawEdge(edgeLayer, e, graph.sim.edgeOn.has(i), graph, right + 40 + (e.lane ? lane++ * 14 : 0)) })
  graph.nodes.forEach((n) => {
    if (n.type === 'role') drawRole(nodeLayer, n, graph.sim)
    else if (n.type === 'ghost') drawGhost(nodeLayer, linkLayer, n, graph)
    else if (n.type === 'decision') drawDecision(nodeLayer, n, graph.sim)
    else if (n.type === 'start') drawStart(nodeLayer, n)
    else if (n.type === 'entry') drawEntry(nodeLayer, n, graph.sim)
    else drawTerminal(nodeLayer, n, graph.sim)
  })
}

function render() {
  const graph = buildGraph()
  currentGraph = graph
  const viewport = document.getElementById('viewport')
  document.getElementById('canvas-bg').setAttribute('fill', sty().canvas)
  document.getElementById('canvas-grid').setAttribute('opacity', sty().grid ? 1 : 0)
  if (!state.view) fitView(graph)
  applyView()
  paint(viewport, graph)
  if (state.pulse) {
    let i = 0
    viewport.querySelectorAll('g.node').forEach((node) => node.animate([{ opacity: 0 }, { opacity: Number(node.getAttribute('opacity') ?? 1) }], { duration: 220, delay: Math.min(i++ * 25, 600), fill: 'backwards' }))
    state.pulse = 0
  }
  return graph
}

function bounds(graph) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity
  graph.nodes.forEach((n) => {
    minX = Math.min(minX, n.x - 10); minY = Math.min(minY, n.y - 36)
    maxX = Math.max(maxX, n.x + n.w + 30); maxY = Math.max(maxY, n.y + n.h + 24)
  })
  const lanes = graph.edges.filter((e) => e.lane).length
  return { minX, minY, maxX: maxX + 24 + lanes * 12, maxY }
}
function fitView(graph = currentGraph) {
  const b = bounds(graph)
  const rect = svg.getBoundingClientRect()
  const drawerH = state.yaml ? rect.height * 0.45 : 0
  const pad = 30
  const k = Math.min(1.25, (rect.width - pad * 2) / (b.maxX - b.minX), (rect.height - drawerH - pad * 2) / (b.maxY - b.minY))
  state.view = { k, x: (rect.width - (b.maxX - b.minX) * k) / 2 - b.minX * k, y: Math.max(pad, (rect.height - drawerH - (b.maxY - b.minY) * k) / 2) - b.minY * k }
}

function renderGallery() {
  document.querySelector('.app').style.display = 'none'
  document.body.style.overflow = 'auto'

  const page = document.createElement('main')
  page.className = 'gallery'

    el('rect', { x: b.minX, y: b.minY, width: b.maxX - b.minX, height: b.maxY - b.minY, fill: sty().canvas }, figure)

function applyView() {
  const { x, y, k } = state.view
  document.getElementById('viewport').setAttribute('transform', `translate(${x} ${y}) scale(${k})`)
  document.getElementById('grid').setAttribute('patternTransform', `translate(${x} ${y}) scale(${k})`)
}
function toWorld(clientX, clientY) {
  const rect = svg.getBoundingClientRect()
  return [(clientX - rect.left - state.view.x) / state.view.k, (clientY - rect.top - state.view.y) / state.view.k]
}
function zoomAt(px, py, k) {
  k = Math.min(2, Math.max(0.2, k))
  state.view.x = px - ((px - state.view.x) / state.view.k) * k
  state.view.y = py - ((py - state.view.y) / state.view.k) * k
  state.view.k = k
  applyView()
}

let drag = null
svg.addEventListener('pointerdown', (event) => {
  svg.setPointerCapture(event.pointerId)
  const nodeEl = event.target.closest('.node')
  if (nodeEl?.dataset.id) {
    const node = currentGraph.byId[nodeEl.dataset.id]
    const [wx, wy] = toWorld(event.clientX, event.clientY)
    drag = { kind: 'node', id: node.id, ox: wx - node.x, oy: wy - node.y, sx: event.clientX, sy: event.clientY, moved: false }
  } else {
    drag = { kind: 'pan', sx: event.clientX, sy: event.clientY, vx: state.view.x, vy: state.view.y, moved: false }
    svg.classList.add('panning')
  }
})
svg.addEventListener('pointermove', (event) => {
  if (!drag) return
  if (Math.hypot(event.clientX - drag.sx, event.clientY - drag.sy) > 3) drag.moved = true
  if (!drag.moved) return
  if (drag.kind === 'pan') {
    state.view.x = drag.vx + event.clientX - drag.sx
    state.view.y = drag.vy + event.clientY - drag.sy
    applyView()
  } else {
    const [wx, wy] = toWorld(event.clientX, event.clientY)
    wfNow().positions[drag.id] = { x: Math.round((wx - drag.ox) / 10) * 10, y: Math.round((wy - drag.oy) / 10) * 10 }
    render()
  }
})
svg.addEventListener('pointerup', () => {
  if (drag && !drag.moved) {
    state.selected = drag.kind === 'node' ? { id: drag.id } : null
    refresh()
  }
  drag = null
  svg.classList.remove('panning')
})
svg.addEventListener('wheel', (event) => {
  event.preventDefault()
  const rect = svg.getBoundingClientRect()
  zoomAt(event.clientX - rect.left, event.clientY - rect.top, state.view.k * Math.exp(-event.deltaY * 0.0015))
}, { passive: false })

function h(tag, props = {}, children = []) {
  const node = document.createElement(tag)
  for (const [k, v] of Object.entries(props)) {
    if (k === 'style') node.setAttribute('style', v)
    else node[k] = v
  }
  node.append(...children.filter((child) => child !== null && child !== undefined && child !== false))
  return node
}
const field = (label, control) => h('label', { className: 'field' }, [h('span', { textContent: label }), control])
function selectOf(options, value, onChange, isDisabled = () => false) {
  const s = h('select')
  options.forEach(([v, label]) => s.append(h('option', { value: v, textContent: label, selected: v === value, disabled: isDisabled(v) })))
  s.onchange = () => onChange(s.value)
  return s
}
function checkbox(label, checked, onChange) {
  const input = h('input', { type: 'checkbox', checked })
  input.onchange = () => onChange(input.checked)
  return h('label', {}, [input, label])
}
function facts(rows) {
  const list = h('dl', { className: 'facts' })
  rows.filter(([, v]) => v).forEach(([k, v]) => list.append(h('dt', { textContent: k }), h('dd', { textContent: v })))
  return list
}
function touched(global = false) {
  if (global) state.globalEdited = true
  else wfNow().edited = true
  refresh()
}

function condEditor(get, set) {
  const wrap = h('div', { className: 'conds' })
  const list = condList(get())
  const write = (next) => set(next.length === 0 ? undefined : next.length === 1 ? next[0] : next)
  list.forEach((token, i) => {
    if (i) wrap.append(h('span', { className: 'and', textContent: 'and' }))
    const known = conditionList()
    const options = known.includes(token) ? known : [token, ...known]
    wrap.append(selectOf(options.map((t) => [t, condLabel(t)]), token, (v) => { const next = [...list]; next[i] = v; write(next) }))
    if (list.length > 1) {
      const remove = h('button', { className: 'btn', textContent: '×', title: 'Remove condition' })
      remove.onclick = () => write(list.filter((_, k) => k !== i))
      wrap.append(remove)
    }
  })
  const add = h('button', { className: 'btn', textContent: list.length ? '+ and' : '+ condition' })
  add.onclick = () => write([...list, 'deep'])
  wrap.append(add)
  return wrap
}

function useEditor(use, baseProvider) {
  const provider = use.provider ?? baseProvider
  const keep = (label) => [['', label]]
  const modelOptions = [...keep('keep'), ...modelsOf(provider).map((m) => [m, prettyModel(m)])]
  if (use.model && !modelsOf(provider).includes(use.model)) modelOptions.push([use.model, use.model])
  const setKey = (key, value) => { if (value) use[key] = value; else delete use[key]; touched() }
  return h('div', {}, [
    h('div', { className: 'row' }, [
      field('Tier', selectOf([...keep('keep'), ...TIER_NAMES.map((t) => [t, t])], use.tier ?? '', (v) => setKey('tier', v))),
      field('Provider', selectOf([...keep('keep'), ...state.providers.map((id) => [id, AGENTS[id]])], use.provider ?? '', (v) => { if (v) use.provider = v; else delete use.provider; delete use.model; touched() })),
    ]),

      field('Effort', selectOf([...keep('keep'), ...EFFORTS.map((e) => [e, e])], use.effort ?? '', (v) => setKey('effort', v))),

      })),

    panel.append(

function gateEditor(panel, wf, id) {
  const p = wf.pb.phases.find((q) => q.id === id)

    h('div', { className: 'kind', textContent: 'Condition' }),
    h('h2', { textContent: 'Check before moving on' }),

  panel.append(field('Passes when', area))
  if (chain.length) {

function traceSection(graph) {

    const line = h('div')
    const reasons = []
    if (chosen) reasons.push(`<span class="ok">because ${condText(chosen.cond)}</span>`)
    if (switched) reasons.push(`<span class="warn">${AGENTS[base.provider]} low, moved to ${AGENTS[final.provider]}</span>`)
    if (stuck) reasons.push('<span class="warn">no provider with tokens left</span>')
    if (spent) reasons.push(`<span class="ok">${AGENTS[spent]} quota would be lost, spent on ${final.tier}</span>`)

    trace.append(line)
  })
  if (sim.bothLow) {
    const text = { ask: 'Every provider is low: work runs and the result suggests waiting for a reset.', 'run-cheapest': 'Every provider is low: work runs on the cheapest tier, flagged.', block: 'Every provider is low: new work is refused.' }[Q().onBothCritical]

  state.providers.map(spareOf).filter(Boolean).forEach((x) => trace.append(h('div', { className: 'ok', textContent: `${AGENTS[x.provider]}: ${x.why}, so ${x.left}% of it would be lost.` })))
  if (state.budget === 'low') trace.append(h('div', { className: 'warn', textContent: globalRuleLines().at(-1) }))
  const scenario = `${TASKS[state.task].label} · ${USAGE_PRESETS[usageKey()]?.label ?? 'custom usage'} · checks: ${CHECKS[state.checks].toLowerCase()} · spent: ${SPENT[state.spent]}`

}

function yScalar(v) {
  if (v === null || v === undefined) return 'null'
  if (typeof v === 'boolean' || typeof v === 'number') return String(v)
  const s = String(v)
  if (/^[A-Za-z0-9_][A-Za-z0-9_.:\/-]*$/.test(s) && !/^(true|false|null|yes|no|on|off)$/i.test(s) && !/^[\d.]+$/.test(s) && !/^\d{4}-\d{2}-\d{2}/.test(s)) return s
  return JSON.stringify(s)
}
const isScalar = (v) => v === null || typeof v !== 'object'
function inlineMap(obj) {
  return `{ ${Object.entries(obj).filter(([, v]) => v !== undefined).map(([k, v]) => `${k}: ${Array.isArray(v) ? `[${v.map(yScalar).join(', ')}]` : yScalar(v)}`).join(', ')} }`
}
const inlinable = (obj) => Object.values(obj).every((v) => v === undefined || isScalar(v) || (Array.isArray(v) && v.every(isScalar)))
function emit(value, indent) {
  const pad = ' '.repeat(indent)
  if (Array.isArray(value)) {
    if (!value.length) return ' []'
    if (value.every(isScalar)) {
      const flat = `[${value.map(yScalar).join(', ')}]`
      return flat.length < 80 ? ` ${flat}` : '\n' + value.map((v) => `${pad}- ${yScalar(v)}`).join('\n')
    }
    return '\n' + value.map((item) => {
      if (isScalar(item)) return `${pad}- ${yScalar(item)}`
      const entries = Object.entries(item).filter(([, v]) => v !== undefined)
      if (inlinable(item) && inlineMap(item).length < 96) return `${pad}- ${inlineMap(item)}`
      return entries.map(([k, v], i) => `${pad}${i === 0 ? '- ' : '  '}${k}:${emit(v, indent + 4)}`).join('\n')
    }).join('\n')
  }
  if (value && typeof value === 'object') {
    const entries = Object.entries(value).filter(([, v]) => v !== undefined)
    if (!entries.length) return ' {}'
    if (indent > 0 && inlinable(value) && inlineMap(value).length < 72) return ` ${inlineMap(value)}`
    return '\n' + entries.map(([k, v]) => `${pad}${k}:${emit(v, indent + 2)}`).join('\n')
  }
  return ` ${yScalar(value)}`
}
const PB_KEYS = ['name', 'goal', 'pickWhen', 'saves', 'avoidWhen', 'source', 'next', 'phases']
const PHASE_KEYS = ['id', 'role', 'who', 'tier', 'provider', 'model', 'effort', 'readOnly', 'workers', 'isolate', 'runner', 'with', 'after', 'if', 'then', 'does', 'returns', 'limit', 'gate', 'rules']
function ordered(obj, keys) {
  const out = {}
  keys.forEach((k) => { if (obj[k] !== undefined && obj[k] !== null) out[k] = obj[k] })
  Object.keys(obj).forEach((k) => { if (!(k in out) && obj[k] !== undefined && obj[k] !== null) out[k] = obj[k] })
  return out
}

  shieldCheck: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
  coins: '<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>',
  scale: '<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
  gauge: '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  piggyBank: '<path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/><path d="M16 11h.01"/>',
  flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
}
const WORKFLOW_ICONS = {
  complete: 'route', direct: 'user', cascade: 'chevronsDown', 'scout-then-build': 'compass', 'plan-big-execute-small': 'network',
  'audit-at-scale': 'listChecks', 'parallel-worktrees': 'gitBranch', 'plan-execute': 'listOrdered', 'advisor-escalation': 'lifeBuoy',
  'best-of-n': 'trophy', 'review-gate': 'shieldCheck', economy: 'coins', balanced: 'scale', performance: 'gauge',
}
function iconOf(key) {
  const span = document.createElement('span')
  span.className = 'ico'
  span.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${LUCIDE[WORKFLOW_ICONS[key]] ?? LUCIDE.route}</svg>`
  return span
}

const RESET_HOURS = [6, 12, 20, 24, 48, 72, 96, 120, 144, 168, 300, 400, 720]
const PLAN_DAYS = [1, 2, 3, 5, 7, 14, 30]
const withCurrent = (list, value) => (value === null || list.includes(value) ? list : [...list, value].sort((a, b) => a - b))
const PROFILE_ICONS = { base: 'scale', savings: 'piggyBank', aggressive: 'flame' }
function lucide(name, size = 13) {
  const span = document.createElement('span')
  span.className = 'ico'
  span.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${LUCIDE[name] ?? LUCIDE.route}</svg>`
  return span
}
function renderProfiles() {
  const root = document.getElementById('profiles')
  root.replaceChildren()
  Object.entries(state.profiles).forEach(([key, profile]) => {
    const b = h('button', { type: 'button', title: profile.summary ?? '' }, [lucide(PROFILE_ICONS[key] ?? 'route'), (profile.name ?? key).toLowerCase()])
    b.setAttribute('aria-pressed', String(key === state.profile))
    b.onclick = () => { if (key === state.profile) return; state.profile = key; state.globalEdited = true; state.pulse = 1; refresh() }
    root.append(b)
  })
}

function renderUsage() {
  const root = document.getElementById('usage')
  root.replaceChildren()
  const q = Q()
  const low = lowProviders()
  const tone = (value) => (value >= q.criticalThreshold ? 'var(--danger)' : value >= q.criticalThreshold - 20 ? 'var(--warn)' : 'var(--fg-muted)')
  state.providers.forEach((id) => {
    const def = PROVIDERS[id]
    const load = mainLoad(id)
    const detail = windowsOf(id).filter((w) => w.main).map((w) => `${w.label} ${usageOf(id, w.key)}%`).join(', ')
    const pill = h('button', { className: `usage-pill${def.reader ? '' : ' unread'}`, title: `${def.label}: ${detail}${def.reader ? '' : '. Alethe does not read this yet; simulated'}`, style: `--pill-color:${tone(load)}` }, [
      h('img', { src: MARKS[id], alt: '' }),
      document.createTextNode(`${load}%`),
      spareOf(id) ? h('span', { className: 'dot spare' }) : low.includes(id) ? h('span', { className: 'dot low' }) : null,
    ])
    pill.setAttribute('aria-pressed', String(state.usageOpen === id))
    pill.onclick = (event) => { event.stopPropagation(); state.usageOpen = state.usageOpen === id ? null : id; refresh() }
    root.append(pill)
  })
  Object.entries(state.routes).forEach(([rid, route]) => {
    const chip = h('button', { className: 'usage-pill route', title: `${ROUTES[rid]?.label ?? rid}: ${route.running ? `running on :${route.port}` : 'installed, not running'}` }, [h('img', { src: MARKS[rid], alt: '' }), route.running ? 'on' : 'off'])
    chip.onclick = (event) => { event.stopPropagation(); state.selected = { id: `route:${rid}` }; refresh() }
    root.append(chip)
  })
  const id = state.usageOpen
  if (!id || !state.providers.includes(id)) return
  const def = PROVIDERS[id]
  const pop = h('div', { className: 'usage-popover' })
  pop.onclick = (event) => event.stopPropagation()
  const tabs = h('div', { className: 'tabs' })
  state.providers.forEach((pid) => {
    const tab = h('button', { title: AGENTS[pid] }, [h('img', { src: MARKS[pid], alt: '' })])
    tab.setAttribute('aria-pressed', String(pid === id))
    tab.onclick = () => { state.usageOpen = pid; refresh() }
    tabs.append(tab)
  })
  pop.append(h('div', { className: 'title' }, ['Usage', tabs]))
  const presets = h('div', { className: 'presets' })
  const current = usageKey()
  Object.entries(USAGE_PRESETS).filter(([key]) => presetFits(key)).forEach(([key, preset]) => {
    const b = h('button', { textContent: preset.label })
    b.setAttribute('aria-pressed', String(key === current))
    b.onclick = () => { state.usage = presetUsage(key); state.pulse = 1; refresh() }
    presets.append(b)
  })
  pop.append(presets)
  const spare = spareOf(id)
  const status = low.includes(id) ? h('span', { className: 'state low', textContent: 'low' }) : spare ? h('span', { className: 'state spare', textContent: 'spare' }) : null
  pop.append(h('div', { className: 'provider' }, [h('img', { src: MARKS[id], alt: '' }), def.label, status]))
  if (!def.reader) pop.append(h('div', { className: 'unread-note', textContent: 'Alethe does not read this usage yet; the values below are a simulation.' }))
  const set = (key, value) => { state.usage[id][key] = value; state.pulse = 1; refresh() }
  windowsOf(id).forEach((w) => {
    const value = h('span', { className: `val${usageOf(id, w.key) >= q.criticalThreshold ? ' hot' : ''}`, textContent: `${usageOf(id, w.key)}%` })
    const range = h('input', { type: 'range', min: 0, max: 100, step: 1, value: usageOf(id, w.key) })
    range.oninput = () => { value.textContent = `${range.value}%`; value.classList.toggle('hot', Number(range.value) >= q.criticalThreshold) }
    range.onchange = () => set(w.key, Number(range.value))
    pop.append(h('div', { className: 'line' }, [h('span', { textContent: w.label }), range, value]))
  })
  if (longWindow(id)) {
    const reset = resetOf(id) ?? 168
    const ends = expiresOf(id)
    const resetSelect = selectOf(withCurrent(RESET_HOURS, reset).map((hours) => [String(hours), `in ${hoursText(hours)}`]), String(reset), (v) => set('reset', Number(v)))
    const planSelect = selectOf([['renews', 'renews'], ...withCurrent(PLAN_DAYS, ends).map((days) => [String(days), `ends in ${days}d`])], ends === null ? 'renews' : String(ends), (v) => set('expires', v === 'renews' ? null : Number(v)))
    pop.append(h('div', { className: 'meta' }, [h('span', { textContent: 'resets' }), resetSelect]), h('div', { className: 'meta' }, [h('span', { textContent: 'plan' }), planSelect]))
  }
  if (spare) pop.append(h('div', { className: 'why', textContent: `${spare.why}; ${spare.left}% would be lost` }))
  pop.append(h('div', { className: 'foot', textContent: `Low: a main window past ${q.criticalThreshold}%. Stop: from ${q.stopAt}% the runner refuses to start work there. Spare: ${q.spareMinLeft}% or more left on a weekly or monthly cycle that ends with the plan or resets within ${q.spareWithinHours}h.` }))
  root.append(pop)
}
document.addEventListener('click', () => { if (state.usageOpen) { state.usageOpen = null; refresh() } })

function renderSidebar() {
  const nav = document.getElementById('sidebar')
  nav.replaceChildren()
  const playbooks = Object.values(workflows).filter((w) => w.kind === 'playbook')
  const routing = Object.values(workflows).filter((w) => w.kind === 'routing')
  document.getElementById('pbCount').textContent = String(playbooks.length + routing.length)
  const group = (title, items, color) => {
    const box = h('div', { className: 'group' }, [h('div', { className: 'group-title' }, [h('span', { className: 'dot', style: `background:${color}` }), title])])
    items.forEach((w) => {
      const name = w.kind === 'playbook' ? w.pb.name : w.name
      const count = w.kind === 'playbook' ? w.pb.phases.length : w.rules.length
      const b = h('button', { className: 'wf', title: (w.kind === 'playbook' ? w.pb.pickWhen : w.blurb) ?? '' }, [iconOf(w.key), h('span', { className: 'name', textContent: name }), w.edited ? h('span', { className: 'edited-dot' }) : null, h('span', { className: 'n', textContent: String(count) })])
      b.setAttribute('aria-current', String(w.id === state.wf))
      b.onclick = () => {
        state.wf = w.id
        if (w.kind === 'routing') state.routingWf = w.id
        state.selected = null
        state.view = null
        state.pulse = 1
        refresh()
      }
      box.append(b)
    })
    nav.append(box)
  }
  group('strategies', playbooks, 'var(--ok)')
  group('task routing', routing, '#0ea5e9')
  const box = h('div', { className: 'group' }, [h('div', { className: 'group-title' }, [h('span', { className: 'dot', style: 'background:var(--fg-muted)' }), 'providers', h('span', { className: 'group-note', textContent: profileNow().name ?? state.profile })])])
  activeOrder().forEach((id, i) => {
    const via = routedVia(id)
    const b = h('button', { className: 'wf', title: `${AGENTS[id]} · ${PROVIDERS[id].adapter} adapter` }, [
      h('span', { className: 'ico' }, [h('img', { src: MARKS[id], alt: '' })]),
      h('span', { className: 'name', textContent: AGENTS[id] }),
      via ? h('img', { className: 'via', src: MARKS[via], alt: '', title: `through ${ROUTES[via]?.label ?? via}` }) : null,
      h('span', { className: 'n', textContent: String(i + 1) }),
    ])
    b.setAttribute('aria-current', String(state.selected?.id === `provider:${id}`))
    b.onclick = () => { state.selected = { id: `provider:${id}` }; refresh() }
    box.append(b)
  })
  Object.entries(state.routes).forEach(([rid, route]) => {
    const b = h('button', { className: 'wf', title: 'Route on the model traffic path' }, [h('span', { className: 'ico' }, [h('img', { src: MARKS[rid], alt: '' })]), h('span', { className: 'name', textContent: ROUTES[rid]?.label ?? rid }), h('span', { className: 'n', textContent: route.running ? 'on' : 'off' })])
    b.setAttribute('aria-current', String(state.selected?.id === `route:${rid}`))
    b.onclick = () => { state.selected = { id: `route:${rid}` }; refresh() }
    box.append(b)
  })
  nav.append(box)
}

function renderScenarioBar() {
  const bar = document.getElementById('scenarioBar')
  bar.replaceChildren()
  const item = (label, options, value, onPick) => h('label', {}, [label, selectOf(Object.entries(options).map(([k, v]) => [k, (typeof v === 'string' ? v : v.label).toLowerCase()]), value, onPick)])
  const pick = (key) => (value) => { state[key] = value; state.pulse = 1; refresh() }
  const parts = [
    item('task', TASKS, state.task, pick('task')),
    item('checks', CHECKS, state.checks, pick('checks')),
    item('budget', BUDGET, state.budget, pick('budget')),
    item('spent', SPENT, String(state.spent), (value) => { state.spent = Number(value); state.pulse = 1; refresh() }),
  ]
  if (activeOrder().every((p) => lowProviders().includes(p))) parts.push(item('all low', BOTH, state.quota.onBothCritical, (value) => { state.quota.onBothCritical = value; state.globalEdited = true; refresh() }))
  parts.forEach((part, i) => {
    if (i) bar.append(h('span', { className: 'divider' }))
    bar.append(part)
  })
}

function refresh() {
  const wf = wfNow()
  document.getElementById('wfTitle').textContent = wf.kind === 'playbook' ? wf.pb.name : `${wf.name} routing`
  document.getElementById('edited').hidden = !(wf.edited || state.globalEdited)
  renderProfiles()
  renderUsage()
  renderScenarioBar()
  renderSidebar()
  const open = Boolean(state.selected || state.info)
  document.getElementById('app').classList.toggle('with-panel', open)
  document.getElementById('panel').hidden = !open
  document.getElementById('infoToggle').setAttribute('aria-pressed', String(state.info && !state.selected))
  const graph = render()
  if (open) renderPanel(graph)
  document.getElementById('yaml').textContent = toYaml()
  history.replaceState(null, '', `${location.search}#${encodeURIComponent([state.wf, state.task, usageKey(), state.checks, state.budget, state.quota.onBothCritical, state.profile, state.spent].join('/'))}`)
}

document.getElementById('infoToggle').onclick = () => {
  state.info = !(state.info && !state.selected)
  state.selected = null
  refresh()
}
document.getElementById('yamlToggle').onclick = (event) => {
  state.yaml = !state.yaml
  event.currentTarget.setAttribute('aria-pressed', String(state.yaml))
  document.getElementById('drawer').hidden = !state.yaml
  fitView()
  applyView()
}
document.getElementById('zoomIn').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, state.view.k * 1.2) }
document.getElementById('zoomOut').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, state.view.k / 1.2) }
document.getElementById('fit').onclick = () => { fitView(); applyView() }
document.getElementById('copy').onclick = () => navigator.clipboard?.writeText(toYaml())
document.getElementById('download').onclick = () => {
  const a = h('a', { href: URL.createObjectURL(new Blob([toYaml()], { type: 'text/yaml' })), download: 'alethe-playbooks.yaml' })
  a.click()
}
window.addEventListener('resize', () => { fitView(); applyView() })

initDefs()
document.getElementById('drawer').hidden = !state.yaml
document.getElementById('yamlToggle').setAttribute('aria-pressed', String(state.yaml))
if (LOADED.error) document.body.prepend(h('div', { className: 'load-error', role: 'alert', textContent: LOADED.error }))
if (params.has('gallery')) { renderGallery(); document.querySelector('.gallery').style.color = sty().text } else refresh()
</script>
</body>
</html>
