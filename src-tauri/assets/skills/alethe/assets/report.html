<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alethe Report</title>
<style>
:root {
  color-scheme: dark;
  --bg: #101114;
  --bg-elevated: #1f2125;
  --bg-sunken: #1a1c1f;
  --panel: #2a2d33;
  --border: #2a2d33;
  --border-strong: rgba(243, 244, 246, 0.22);
  --fg: #f3f4f6;
  --fg-muted: #c8c8d0;
  --text-tertiary: #8b8b95;
  --text-quaternary: #6b6b75;
  --accent: #f97316;
  --wire: #4a4d55;
  --radius-sm: 4px;
  --radius-md: 8px;
  --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'Caskaydia Cove Nerd Font Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace;
  --brand-claude: #c15f3c;
  --brand-codex: #0e7c5f;
  --brand-agy: #2563eb;
  --brand-kimi: #4f46e5;
  --brand-kiro: #7c3aed;
  --brand-copilot: #374151;
  --brand-gemini: #1a73e8;
  --brand-other: #4b5563;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #ef4444;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--font-sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; }
.titlebar { position: sticky; top: 0; z-index: 10; height: 32px; display: flex; align-items: center; gap: 7px; padding: 0 12px; background: var(--bg-elevated); border-bottom: 1px solid var(--border); font-size: 12px; white-space: nowrap; overflow: hidden; }
.titlebar .logo { width: 16px; height: 16px; border-radius: 4px; }
.titlebar .app-name { font-weight: 600; }
.titlebar .crumb { color: var(--text-quaternary); }
.titlebar .crumb-label { color: var(--text-tertiary); }
.titlebar .crumb-current { color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; }
.page { max-width: 1080px; margin: 0 auto; padding: 28px 24px 56px; }
h1 { margin: 0; font-size: 20px; font-weight: 650; }
.why { margin: 4px 0 0; color: var(--text-tertiary); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 28px; margin: 18px 0 0; }
.stat b { display: block; font-size: 18px; font-weight: 650; }
.stat span { font-size: 11.5px; color: var(--text-tertiary); }
h2 { margin: 32px 0 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); }
.route-wrap { margin-top: 24px; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg-sunken); }
.route { position: relative; display: grid; grid-template-columns: minmax(150px, 1fr) 140px minmax(220px, 1.3fr); align-items: center; gap: 0 96px; padding: 28px; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.wires path { fill: none; transition: stroke 0.15s, opacity 0.15s; }
.wires .in { stroke: var(--wire); stroke-width: 1.5; stroke-dasharray: 4 4; }
.wires .out { stroke: var(--wire); }
.wires .top { stroke: var(--accent); }
.wires .lit { stroke: var(--accent); opacity: 1; }
.wires .dim { opacity: 0.25; }
.wires .share { font: 10px var(--font-mono); fill: var(--text-tertiary); }
.col { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; min-width: 0; }
.src { display: flex; align-items: center; gap: 10px; min-width: 0; cursor: default; }
.src .tile { width: 40px; height: 40px; flex-shrink: 0; display: grid; place-items: center; border: 1px solid var(--border-strong); border-radius: var(--radius-md); background: var(--bg-elevated); font: 600 14px var(--font-mono); }
.src .tile.failed { border-color: var(--critical); }
.src .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src .sub { font: 11px var(--font-mono); color: var(--text-tertiary); }
.hub { justify-self: center; width: 120px; height: 120px; display: grid; place-items: center; align-content: center; gap: 6px; border: 2px solid var(--accent); border-radius: 50%; background: var(--bg-elevated); text-align: center; }
.hub img { width: 24px; height: 24px; object-fit: contain; border-radius: 6px; margin-bottom: 2px; }
.hub .role { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; color: var(--text-tertiary); }
.hub .who { font-size: 13px; font-weight: 650; line-height: 1.2; }
.hub .model { max-width: 100px; font: 10px var(--font-mono); color: var(--fg-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dst { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px 0 10px; border: 2px solid transparent; border-radius: var(--radius-md); background: var(--pill); color: #fff; font-weight: 650; }
.pill.top { border-color: var(--accent); }
.pill img { width: 16px; height: 16px; object-fit: contain; border-radius: 3px; }
.dst .sub { font: 11px var(--font-mono); color: var(--fg-muted); }
.dst .models { font: 11px var(--font-mono); color: var(--text-tertiary); }
.dst .bad { color: var(--critical); }
.route.compact { grid-template-columns: minmax(0, auto) 76px minmax(0, 1fr); gap: 0 30px; min-width: 0; padding: 18px 14px; }
.route.compact .src .sub { display: none; }
.route.compact .src .tile { width: 32px; height: 32px; font-size: 12px; }
.route.compact .src .name { max-width: 64px; font-size: 12px; }
.route.compact .hub { width: 76px; height: 76px; gap: 2px; }
.route.compact .hub img { width: 18px; height: 18px; }
.route.compact .hub .who { font-size: 11px; }
.route.compact .hub .model { max-width: 64px; font-size: 9px; }
.route.compact .hub .role { display: none; }
.route.compact .pill { height: 28px; padding: 0 10px 0 8px; font-size: 12px; }
.route.compact .dst .sub, .route.compact .dst .models { font-size: 10px; white-space: normal; }
.dim-text { opacity: 0.35; transition: opacity 0.15s; }
.hint { margin: 8px 2px 0; font-size: 11.5px; color: var(--text-quaternary); }
.changes { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.changes li { display: flex; gap: 10px; color: var(--fg-muted); }
.changes time, .changes b { font: 11px var(--font-mono); color: var(--text-tertiary); white-space: nowrap; padding-top: 2px; }
.changes b { color: var(--fg); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-tertiary); padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--bg-sunken); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--fg-muted); white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tbody tr.row { cursor: pointer; }
tbody tr.row:hover td, tbody tr.row.lit td { background: var(--bg-elevated); }
tbody tr:last-child td { border-bottom: 0; }
.mono { font-family: var(--font-mono); }
.ran { display: inline-flex; align-items: center; gap: 6px; }
.ran img { width: 14px; height: 14px; object-fit: contain; }
.status { display: inline-flex; align-items: center; gap: 6px; }
.status i { width: 7px; height: 7px; border-radius: 50%; }
tr.detail td { white-space: normal; background: var(--bg-sunken); color: var(--fg-muted); font-size: 12px; }
tr.detail dl { margin: 0; display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px 12px; }
tr.detail dt { color: var(--text-tertiary); }
tr.detail dd { margin: 0; overflow-wrap: anywhere; }
tr.detail code { font: 11.5px var(--font-mono); color: var(--fg); }
.todo { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.todo li { color: var(--fg-muted); }
.todo li::before { content: '→ '; color: var(--accent); }
.todo code { font: 11.5px var(--font-mono); color: var(--fg); overflow-wrap: anywhere; }
.foot { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--border); color: var(--text-quaternary); font-size: 11.5px; }
.load-error { margin: 24px auto; max-width: 640px; padding: 10px 14px; border: 1px solid var(--critical); border-radius: var(--radius-md); background: var(--bg-elevated); }
@media (prefers-reduced-motion: reduce) { .wires path, .dim-text { transition: none; } }
@media (max-width: 560px) { .page { padding: 20px 16px 40px; } }
</style>
</head>

const LOGO = document.querySelector('.titlebar .logo').src
const NAMES = { claude: 'Claude', codex: 'Codex', agy: 'Antigravity', kimi: 'Kimi', kiro: 'Kiro', copilot: 'Copilot', gemini: 'Gemini CLI' }
const ORDER = ['claude', 'codex', 'agy', 'kimi', 'kiro', 'copilot', 'gemini']
const STATUS = {
  succeeded: ['succeeded', 'var(--good)'], failed: ['failed', 'var(--critical)'], timed_out: ['timed out', 'var(--critical)'],
  interrupted: ['interrupted', 'var(--critical)'], stopped: ['stopped', 'var(--warning)'], skipped: ['skipped', 'var(--text-quaternary)'],
  running: ['running', 'var(--warning)'], queued: ['queued', 'var(--text-quaternary)'],
}
const MARK_LABELS = { used: 'used', partial: 'partly used', discarded: 'discarded' }
const NOTE_KINDS = { skip: 'skipped', add: 'added', repeat: 'repeated', switch: 'switched', freeform: 'freeform', self: 'did it myself', stop: 'stopped', note: 'note' }

function h(tag, props = {}, children = []) {
  const node = document.createElement(tag)
  Object.entries(props).forEach(([key, value]) => {
    if (value === undefined || value === null || value === false) return
    if (key === 'style') node.style.cssText = value
    else if (key === 'className' || key === 'textContent' || key === 'title') node[key] = value
    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value)
    else node.setAttribute(key, value)
  })
  ;[].concat(children).forEach((child) => { if (child !== null && child !== undefined && child !== false) node.append(child) })
  return node
}
const svg = (tag, attrs = {}) => { const node = document.createElementNS('http://www.w3.org/2000/svg', tag); Object.entries(attrs).forEach(([k, v]) => node.setAttribute(k, v)); return node }
const isNum = (v) => typeof v === 'number' && Number.isFinite(v)
const sum = (values) => { const known = values.filter(isNum); return known.length ? known.reduce((a, b) => a + b, 0) : null }
const count = (n) => (isNum(n) ? Math.round(n).toLocaleString('en-US') : '-')
const compact = (n) => (isNum(n) ? (n >= 10000 ? new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 }).format(n) : count(n)) : '-')
const cost = (n) => (isNum(n) ? `$${n < 0.01 && n > 0 ? n.toFixed(4) : n.toFixed(2)}` : '-')
function seconds(s) {
  if (!isNum(s)) return '-'
  if (s < 60) return `${Math.round(s)}s`
  const m = Math.floor(s / 60)
  return m < 60 ? `${m}m ${Math.round(s % 60)}s` : `${Math.floor(m / 60)}h ${m % 60}m`
}
const clock = (iso) => { const d = iso ? new Date(iso) : null; return d && !isNaN(d) ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '' }
const name = (id) => NAMES[id] ?? id
const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`
const brand = (provider) => (ORDER.includes(provider) ? `var(--brand-${provider})` : 'var(--brand-other)')
const rank = (provider) => { const i = ORDER.indexOf(provider); return i === -1 ? ORDER.length : i }

function loadReport() {
  const text = document.getElementById('report-data').textContent.trim()
  if (!text || text === ['__REPORT', 'JSON__'].join('_')) return { error: 'This page has no report yet: put the report JSON into its report-data block.' }
  try {
    const data = JSON.parse(text)
    if (!data || typeof data !== 'object' || !Array.isArray(data.runs)) throw new Error('the JSON has no runs list')
    return { data }
  } catch (error) {
    return { error: `Could not read the report: ${error.message}` }
  }
}

function normalize(report) {
  const runs = report.runs.map((run, index) => ({ ...run, index: index + 1, workers: (run.workers ?? []).map((w) => ({ ...w, label: w.label ?? w.provider ?? 'unknown', wave: index + 1 })) }))
  const workers = runs.flatMap((run) => run.workers)
  const totals = { ...(report.totals ?? {}) }
  totals.tokens ??= sum(workers.map((w) => w.tokens))
  totals.cachedTokens ??= sum(workers.map((w) => w.cachedTokens))
  totals.costUsd ??= sum(workers.map((w) => w.costUsd))
  totals.workerSeconds ??= sum(workers.map((w) => w.durationSeconds))
  totals.wallSeconds ??= sum(runs.map((r) => r.wallSeconds))
  totals.costReportedBy ??= [...new Set(workers.filter((w) => isNum(w.costUsd)).map((w) => w.label))]
  if (!totals.value && workers.some((w) => w.mark)) {
    totals.value = {}
    ;['used', 'partial', 'discarded', 'unmarked'].forEach((key) => { totals.value[key] = { workers: workers.filter((w) => (w.mark ?? 'unmarked') === key).map((w) => w.id) } })
  }
  const providers = {}
  workers.forEach((w) => {
    const p = (providers[w.label] ??= { label: w.label, provider: w.provider ?? w.label, workers: [], waves: new Set(), models: new Set() })
    p.workers.push(w)
    p.waves.add(w.wave)
    p.models.add([w.model ?? 'default', w.effort].filter(Boolean).join(' '))
  })
  Object.values(providers).forEach((p) => {
    p.tokens = sum(p.workers.map((w) => w.tokens))
    p.costUsd = sum(p.workers.map((w) => w.costUsd))
    p.failed = p.workers.filter((w) => w.status !== 'succeeded').length
  })
  return { ...report, runs, workers, totals, providers, journal: report.journal ?? [], followUps: report.followUps ?? {} }
}

function stats(r) {
  const t = r.totals
  const ok = r.workers.filter((w) => w.status === 'succeeded').length
  const items = [
    [`${ok}/${r.workers.length}`, 'workers succeeded'],
    [seconds(t.wallSeconds), `running, ${seconds(t.workerSeconds)} of worker time`],
    [compact(t.tokens), isNum(t.cachedTokens) && t.cachedTokens ? `tokens, plus ${compact(t.cachedTokens)} cache reads` : 'tokens reported'],
    [cost(t.costUsd), t.costReportedBy?.length ? `reported by ${t.costReportedBy.map(name).join(', ')}` : 'no CLI reported cost'],
  ]
  const value = t.value
  if (value) {
    const extra = [value.partial?.workers?.length ? `${value.partial.workers.length} partly` : '', value.discarded?.workers?.length ? `${value.discarded.workers.length} discarded` : ''].filter(Boolean)
    items.push([`${value.used?.workers?.length ?? 0}/${r.workers.length}`, `results used${extra.length ? `, ${extra.join(', ')}` : ''}`])
  }
  return h('div', { className: 'stats' }, items.map(([big, small]) => h('div', { className: 'stat' }, [h('b', { textContent: big }), h('span', { textContent: small })])))
}

function routeDiagram(r) {
  const providers = Object.values(r.providers).sort((a, b) => rank(a.provider) - rank(b.provider))
  const shareKey = providers.some((p) => isNum(p.tokens) && p.tokens > 0) ? 'tokens' : 'workers'
  const shareOf = (p) => (shareKey === 'tokens' ? p.tokens ?? 0 : p.workers.length)
  const total = providers.reduce((a, p) => a + shareOf(p), 0) || 1
  const top = providers.length > 1 ? providers.reduce((best, p) => (shareOf(p) > shareOf(best) ? p : best), providers[0]) : null
  const waveNodes = r.runs.map((run) => h('div', { className: 'src', 'data-wave': String(run.index) }, [
    h('div', { className: `tile${run.workers.some((w) => w.status !== 'succeeded') ? ' failed' : ''}`, textContent: String(run.index) }),
    h('div', { style: 'min-width:0' }, [h('div', { className: 'name', textContent: run.phase || run.title || `wave ${run.index}` }), h('div', { className: 'sub', textContent: `${plural(run.workers.length, 'worker')} · ${seconds(run.wallSeconds)}` })]),
  ]))
  const lead = r.lead && r.lead.provider ? r.lead : null
  const leadModel = lead ? [lead.model, lead.effort].filter(Boolean).join(' ') : ''
  const hub = h('div', { className: 'hub', title: lead ? `${name(lead.provider)} led this orchestration: it planned the waves and wrote the prompts` : 'The lead was not recorded' }, [
    h('img', { src: lead && MARKS[lead.provider] ? MARKS[lead.provider] : LOGO, alt: '' }),
    h('span', { className: 'role', textContent: 'LEAD' }),
    h('span', { className: 'who', textContent: lead ? name(lead.provider) : 'Lead' }),
    leadModel ? h('span', { className: 'model', textContent: leadModel }) : null,
  ])
  const destNodes = providers.map((p) => h('div', { className: 'dst', 'data-provider': p.label }, [
    h('span', { className: `pill${p === top ? ' top' : ''}`, style: `--pill:${brand(p.provider)}` }, [MARKS[p.provider] ? h('img', { src: MARKS[p.provider], alt: '' }) : null, name(p.label)]),
    h('div', { className: 'sub' }, [`${plural(p.workers.length, 'worker')} · ${compact(p.tokens)} tokens · ${cost(p.costUsd)}`, p.failed ? h('span', { className: 'bad', textContent: ` · ${p.failed} not succeeded` }) : null]),
    h('div', { className: 'models', textContent: [...p.models].join(', ') }),
  ]))
  const wires = svg('svg', { class: 'wires', 'aria-hidden': 'true' })
  const route = h('div', { className: 'route' }, [wires, h('div', { className: 'col' }, waveNodes), hub, h('div', { className: 'col' }, destNodes)])

  function draw() {
    wires.replaceChildren()
    route.classList.toggle('compact', route.parentElement.clientWidth < 640)
    const base = route.getBoundingClientRect()
    const box = hub.getBoundingClientRect()
    const left = box.left - base.left
    const right = left + box.width
    const hy = box.top - base.top + box.height / 2
    waveNodes.forEach((node) => {
      const tile = node.querySelector('.tile').getBoundingClientRect()
      const x = node.getBoundingClientRect().right - base.left + 10
      const y = tile.top - base.top + tile.height / 2
      const mid = (x + left) / 2
      wires.append(svg('path', { class: 'in', 'data-wave': node.dataset.wave, d: `M${x},${y} C${mid},${y} ${mid},${hy} ${left},${hy}` }))
    })
    destNodes.forEach((node, i) => {
      const p = providers[i]
      const pill = node.querySelector('.pill').getBoundingClientRect()
      const x = pill.left - base.left
      const y = pill.top - base.top + pill.height / 2
      const mid = (right + x) / 2
      const share = shareOf(p) / total
      wires.append(svg('path', { class: `out${p === top ? ' top' : ''}`, 'data-provider': p.label, 'stroke-width': String(1.5 + share * 4), d: `M${right},${hy} C${mid},${hy} ${mid},${y} ${x},${y}` }))
      const label = svg('text', { class: 'share', x: String(x - 8), y: String(y - 6), 'text-anchor': 'end' })
      label.textContent = `${Math.round(share * 100)}%`
      wires.append(label)
    })
  }

  function light(waves, labels) {
    const on = waves !== null
    wires.querySelectorAll('path').forEach((path) => {
      const hit = path.dataset.wave ? on && waves.has(Number(path.dataset.wave)) : on && labels.has(path.dataset.provider)
      path.classList.toggle('lit', hit)
      path.classList.toggle('dim', on && !hit)
    })
    waveNodes.forEach((node) => node.classList.toggle('dim-text', on && !waves.has(Number(node.dataset.wave))))
    destNodes.forEach((node) => node.classList.toggle('dim-text', on && !labels.has(node.dataset.provider)))
    document.querySelectorAll('tr.row').forEach((row) => row.classList.toggle('lit', on && waves.has(Number(row.dataset.wave)) && labels.has(row.dataset.provider)))
  }
  waveNodes.forEach((node) => {
    const wave = Number(node.dataset.wave)
    const labels = new Set(r.runs[wave - 1].workers.map((w) => w.label))
    node.addEventListener('mouseenter', () => light(new Set([wave]), labels))
    node.addEventListener('mouseleave', () => light(null, null))
  })
  destNodes.forEach((node, i) => {
    const p = providers[i]
    node.addEventListener('mouseenter', () => light(p.waves, new Set([p.label])))
    node.addEventListener('mouseleave', () => light(null, null))
  })
  const wrap = h('div', { className: 'route-wrap' }, route)
  let width = 0
  new ResizeObserver(() => { if (wrap.clientWidth !== width) { width = wrap.clientWidth; requestAnimationFrame(draw) } }).observe(wrap)
  return { node: wrap, shareKey }
}

function workerTable(r) {
  const body = h('tbody')
  r.workers.forEach((w) => {
    const [label, color] = STATUS[w.status] ?? [String(w.status ?? 'unknown').replace(/_/g, ' '), 'var(--text-quaternary)']
    const row = h('tr', { className: 'row', 'data-wave': String(w.wave), 'data-provider': w.label, title: 'Show details' }, [
      h('td', { className: 'num', textContent: String(w.wave) }),
      h('td', { className: 'mono', textContent: w.id }),
      h('td', {}, h('span', { className: 'ran' }, [MARKS[w.provider] ? h('img', { src: MARKS[w.provider], alt: '' }) : null, [name(w.label), w.model ?? 'default', w.effort].filter(Boolean).join(' · ')])),
      h('td', {}, h('span', { className: 'status' }, [h('i', { style: `background:${color}` }), label])),
      h('td', { className: 'num', textContent: seconds(w.durationSeconds) }),
      h('td', { className: 'num', textContent: compact(w.tokens) }),
      h('td', { className: 'num', textContent: cost(w.costUsd) }),
      h('td', { textContent: MARK_LABELS[w.mark] ?? '-' }),
    ])
    const dl = h('dl')
    const add = (k, v) => { if (v !== null && v !== undefined && v !== '') dl.append(h('dt', { textContent: k }), h('dd', {}, v)) }
    add('Why', w.why)
    add('Summary', w.summary)
    add('Error', [w.failureKind, w.error].filter(Boolean).join(': '))
    add('Tier', w.modelNote)
    add('Cache reads', isNum(w.cachedTokens) && w.cachedTokens ? count(w.cachedTokens) : null)
    add('Changes', w.diff ? `${w.diff.files} files, +${w.diff.insertions} −${w.diff.deletions}` : null)
    add('Session', w.sessionId ? h('code', { textContent: w.sessionId }) : null)
    add('Result', w.resultPath ? h('code', { textContent: w.resultPath }) : null)
    const detail = h('tr', { className: 'detail' }, h('td', { colspan: '8' }, dl))
    detail.hidden = true
    row.addEventListener('click', () => { detail.hidden = !detail.hidden })
    body.append(row, detail)
  })
  const numeric = ['Wave', 'Time', 'Tokens', 'Cost']
  const head = h('thead', {}, h('tr', {}, ['Wave', 'Worker', 'Ran on', 'Status', 'Time', 'Tokens', 'Cost', 'Result'].map((c) => h('th', { className: numeric.includes(c) ? 'num' : '', textContent: c }))))
  return h('div', { className: 'table-wrap' }, h('table', {}, [head, body]))
}

function todo(r) {
  const items = []
  const f = r.followUps
  ;(f.attention ?? []).forEach((a) => {
    const text = [a.error, ...(a.reasons ?? [])].filter(Boolean).join('; ')
    items.push([h('code', { textContent: a.worker }), ` ${String(a.status).replace(/_/g, ' ')}${text ? `: ${text}` : ''}${a.hint ? `. ${a.hint[0].toUpperCase()}${a.hint.slice(1)}` : ''}`, ...(a.resume ? ['. Resume session ', h('code', { textContent: a.resume })] : [])])
  })
  ;(f.worktrees ?? []).forEach((wt) => items.push(['Review worktree ', h('code', { textContent: wt.path }), wt.diff ? ` (${wt.diff.files} files, +${wt.diff.insertions} −${wt.diff.deletions})` : '', ', then remove it.']))
  ;(f.mainCheckoutChanges ?? []).forEach((c) => items.push([h('code', { textContent: c.worker }), ' changed the main checkout', ...(c.diffPath ? ['; see ', h('code', { textContent: c.diffPath })] : [])]))
  const unmarked = r.totals.value?.unmarked?.workers ?? []
  if (unmarked.length) items.push(['Mark ', ...unmarked.flatMap((id, i) => [i ? ', ' : '', h('code', { textContent: id })]), ' as used, partial or discarded.'])
  return items
}

function render() {
  const root = document.getElementById('report')
  const loaded = loadReport()
  if (loaded.error) {
    root.append(h('div', { className: 'load-error', role: 'alert', textContent: loaded.error }))
    return
  }
  const r = normalize(loaded.data)
  const title = r.title || r.runs[0]?.title || 'Orchestration'
  document.title = `${title} · Alethe Report`
  document.getElementById('crumb').textContent = title
  const playbook = r.playbooks?.length ? `${r.playbooks.join(', ')} · ` : ''
  root.append(h('h1', { textContent: title }), h('p', { className: 'why', textContent: `${playbook}${plural(r.runs.length, 'wave')}${r.why ? ` · ${r.why}` : ''}` }), stats(r))
  const diagram = routeDiagram(r)
  root.append(diagram.node, h('p', { className: 'hint', textContent: `Line width and % follow each provider's share of ${diagram.shareKey === 'tokens' ? 'reported tokens' : 'workers'}. Hover a wave or a provider to follow its route.` }))
  if (r.journal.length) {
    root.append(h('h2', { textContent: 'Changes to the plan' }), h('ul', { className: 'changes' }, r.journal.map((e) => h('li', {}, [h('time', { textContent: clock(e.at) }), h('b', { textContent: NOTE_KINDS[e.kind] ?? e.kind ?? 'note' }), h('span', { textContent: e.text ?? '' })]))))
  }
  root.append(h('h2', { textContent: 'Workers' }), workerTable(r))
  const left = todo(r)
  if (left.length) root.append(h('h2', { textContent: 'Left to do' }), h('ul', { className: 'todo' }, left.map((parts) => h('li', {}, parts))))
  const note = ['Tokens and cost are only what each CLI reported; nothing is estimated.']
  if ((r.totals.costReportedBy ?? []).includes('claude')) note.push('Claude reports cost at API prices; on a subscription it used plan limits instead.')
  root.append(h('div', { className: 'foot', textContent: note.join(' ') + (r.skillVersion ? ` alethe-orchestrate v${r.skillVersion}.` : '') }))
}
render()
</script>
</body>
</html>
