[package]
name = "alethe"
version = "1.7.0"
description = "Alethe — terminal multiplexer GUI"
authors = ["Kauã Miguel"]
license = "AGPL-3.0-or-later"
edition = "2021"
# Two binaries in this crate (alethe + alethe-orchestrator-mcp). Without
# default-run, the bare `cargo run` that `tauri dev` issues cannot pick one and
# aborts before the app ever starts.
default-run = "alethe"

[lib]
name = "alethe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
# ghostty_linked and apple_speech_linked are custom cfgs set by build.rs when the native Ghostty
# backend / the Apple speech bridge are linked. Declaring them avoids "unexpected cfg" warnings.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ghostty_linked)", "cfg(apple_speech_linked)"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
serde_json = "1"

[dependencies]
nanoid = "0.4"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps a round-tripped Value in file order. Without it, rewriting one
# key of ~/.claude.json would alphabetise its other 80+ top-level keys.
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2", features = ["image-png", "macos-private-api", "unstable"] }
tauri-plugin-dialog = "2"
# ~2.3: 2.4 needs Tauri 2.12 and rustc 1.90.
tauri-plugin-global-shortcut = "~2.3"
tauri-plugin-notification = "2.3.3"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "process", "io-util", "macros"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
which = "6"
zip = "0.6"
tar = "0.4"
bzip2 = "0.4"
flate2 = "1"
sha2 = "0.10"
sha1 = "0.10"
sysinfo = "0.31"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
hex = "0.4"
cpal = "0.15"
# Decodes OpenRouter speech replies (MP3: its PCM rate is model-dependent and undocumented).
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
# On-device STT (Parakeet / Whisper / …). Build script downloads prebuilt libs when unset.
sherpa-onnx = "1.13.6"
# Narration for voice conversation: AVSpeechSynthesizer (macOS), WinRT (Windows),
# speech-dispatcher (Linux, needs libspeechd-dev at build time).
tts = "0.26.3"
tiny_http = "0.12"
# keyring v3 enables NO platform backend by default: without an explicit
# feature it uses a mock store and every get_password() fails. The native
# backends are declared per platform below (macos/windows/linux).
keyring = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std"] }
dirs-next = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
urlencoding = "2"
dotenvy = "0.15"
discord-rich-presence = "1.1.0"
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
# toml_edit, not toml: it preserves comments, key order and formatting, which is
# required to change one `[mcp_servers.*]` table inside a user's ~/.codex/config.toml
# without rewriting the credentials, hooks and project tables around it.
toml_edit = "0.22"

# Prevents parallel Alethe instances (a prerequisite of the `save_projects`
# monotonicity guard in projects.rs). Desktop only: the crate does not support
# mobile.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# macOS-only dependencies for the native Ghostty bridge (embedding terminal
# surfaces in an NSView over the Tauri WebView). Versions match the ones
# Tauri 2.11 already brings into the tree, so they are not duplicated.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# Turns the voice HUD into a non-activating NSPanel (enables Tauri's macos-private-api).
tauri-nspanel = "2.1"
# Keychain backend (where Claude Code stores its OAuth token on macOS).
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Windows-only dependencies (registry + Win32). `winreg` does not even compile on
# Linux/macOS, so they sit behind `cfg(windows)`; the code that uses them is gated too.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Windows Credential Manager backend.
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Secret Service backend (GNOME Keyring / KWallet) on Linux. The
# `sync-secret-service` + `crypto-rust` variant needs neither tokio nor system
# libraries for the D-Bus session encryption.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
# Match the webkit2gtk version Tauri already pulls so we can enable media-stream
# and answer permission-request for getUserMedia (voice dictation).
webkit2gtk = { version = "2.0.1", features = ["v2_40"] }
# Same major the single-instance plugin already resolves to (5.x), so the crate
# is not duplicated in the tree. Used only by the D-Bus handoff diagnostic probe
# in single_instance_probe.rs.
zbus = "5"

# kill(2) on a process group (pty::kill_process_tree). Already in the tree through tokio.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# In dev, unwind lets a command panic become an Err instead of taking the whole
# app down during an HMR session. Release keeps abort (smaller binary).
[profile.dev]
panic = "unwind"

[profile.release]
panic = "abort"
codegen-units = 1
debug = false
incremental = false
lto = true
opt-level = "s"
strip = true
