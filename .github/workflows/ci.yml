name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antigos do mesmo branch/PR quando um novo chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # vitest run — suíte única, todo teste vive colocado como src/**/*.test.ts.
      - name: Run unit tests
        run: npm test

      # `npm run build` = tsc (typecheck) + vite build. Falha se houver erro de tipo.
      - name: Typecheck and build
        run: npm run build

  rust:
    name: Rust check (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows
          - platform: ubuntu-22.04
            label: Linux
          - platform: macos-latest
            label: macOS
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo check
        working-directory: src-tauri
        run: cargo check

      # Não-bloqueante por enquanto: já há ~37 warnings pré-existentes no
      # código atual (nenhum deles deste PR). Endurecer pra `-D warnings`
      # depois de uma limpeza dedicada, não junto de outra tarefa.
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets
        continue-on-error: true

      - name: Storage sync contract tests
        working-directory: src-tauri
        run: cargo test --test profile_sync_contract

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # Windows primeiro por ser a plataforma prioritária do app (ver CONTRIBUTING.md);
  # roda a instância buildada em profile de teste isolado (nunca `tauri dev`
  # interativo) via @wdio/tauri-service, provider embedded (msedgedriver
  # auto-gerenciado no Windows, sem setup extra).
  e2e:
    name: E2E (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build debug app (no bundle)
        run: npm run test:e2e:build

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload screenshots + reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/__screenshots__/
            e2e/__reports__/
          retention-days: 14
