name: Release

on:
  # A tag does NOT trigger a release. `npm run release` only stamps the version in
  # git; publishing installers is a deliberate action, through
  # `npm run release:publish` (gh workflow run) or Actions -> Release -> Run workflow.
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.label }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows x64
            args: ''
          - platform: ubuntu-22.04
            label: Linux x64
            args: ''
          - platform: macos-latest
            label: macOS Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            label: macOS Intel
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libasound2-dev is ALSA: `cpal` (on-device voice dictation) links against it
          # through alsa-sys, and without it the Linux build panics in its build script.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature (minisign). Without these secrets the build FAILS,
          # because bundle.createUpdaterArtifacts is on. Generate the pair with
          # `npm run tauri signer generate` and register it in the repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Evita empacotar as bibliotecas do Wayland para não dar conflito com as do host.
          # Isso previne o crash EGL_BAD_PARAMETER no WebKit ao abrir no Arch e Fedora.
          LINUXDEPLOY_PLUGIN_GTK_OMIT_LIBRARIES: "libwayland-client.so.1:libwayland-egl.so.1"
        with:
          tagName: v__VERSION__
          releaseName: 'Alethe v__VERSION__'
          # Placeholder only. The release-notes job below replaces it with
          # docs/releases/<tag>.md once every platform has finished uploading.
          releaseBody: 'Free desktop build of Alethe for Windows, macOS and Linux. Local app is free; cloud/sync services may be offered separately.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # The release body written by tauri-action is a single generic line, the same for
  # every version. The real notes live in the repo, one file per version, so they are
  # reviewed in a PR like anything else. A version with no notes file keeps the
  # placeholder instead of failing the release.
  release-notes:
    name: Publish the release notes
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply docs/releases/<tag>.md as the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          NOTES="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::warning::$NOTES not found — keeping the generic release body for $VERSION"
            exit 0
          fi
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
          echo "Release body for $VERSION set from $NOTES"

  # tauri-action picks the Windows bundle for the generic `windows-x86_64` key of
  # latest.json on its own, and it picks the MSI. Almost everyone installs through
  # NSIS (the landing page serves setup.exe), and an MSI applied over an NSIS install
  # neither upgrades it nor restarts the app — the updater closes Alethe and nothing
  # comes back. Here the generic key is repointed at NSIS, without dropping the
  # `-msi` / `-nsis` keys, which stay published.
  fix-updater-target:
    name: Point windows-x86_64 at NSIS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rewrite latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          echo "Release: $VERSION"

          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json --clobber

          node <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('latest.json', 'utf8'))
          const nsis = manifest.platforms['windows-x86_64-nsis']
          if (!nsis) {
            console.error('windows-x86_64-nsis missing from latest.json — refusing to rewrite')
            process.exit(1)
          }
          const before = manifest.platforms['windows-x86_64']?.url ?? '(absent)'
          manifest.platforms['windows-x86_64'] = nsis
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2))
          console.log(`windows-x86_64: ${before.split('/').pop()} -> ${nsis.url.split('/').pop()}`)
          NODE

          gh release upload "$VERSION" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify every platform is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output check.json --clobber

          node <<'NODE'
          const manifest = JSON.parse(require('fs').readFileSync('check.json', 'utf8'))
          const required = ['windows-x86_64', 'darwin-x86_64', 'darwin-aarch64', 'linux-x86_64']
          const missing = required.filter((key) => !manifest.platforms[key])
          const unsigned = Object.entries(manifest.platforms)
            .filter(([, value]) => !value.signature)
            .map(([key]) => key)

          for (const [key, value] of Object.entries(manifest.platforms)) {
            console.log(`  ${key.padEnd(22)} ${value.url.split('/').pop()}`)
          }
          if (missing.length) {
            console.error(`\nMissing platforms: ${missing.join(', ')}`)
            process.exit(1)
          }
          if (unsigned.length) {
            console.error(`\nUnsigned platforms: ${unsigned.join(', ')}`)
            process.exit(1)
          }
          if (!manifest.platforms['windows-x86_64'].url.endsWith('.exe')) {
            console.error('\nwindows-x86_64 is not the NSIS installer')
            process.exit(1)
          }
          console.log('\nManifest OK')
          NODE
