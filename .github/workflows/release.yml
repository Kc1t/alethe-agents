name: Release

on:
  # Tag NÃO dispara release. `npm run release` só marca a versão no git;
  # publicar instaladores é uma ação deliberada via `npm run release:publish`
  # (gh workflow run) ou pela aba Actions -> Release -> Run workflow.
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.label }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows x64
            args: ''
          - platform: ubuntu-22.04
            label: Linux x64
            args: ''
          - platform: macos-latest
            label: macOS Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            label: macOS Intel
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare compatible Linux AppImage GTK plugin
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GTK_PLUGIN_COMMIT: b5eb8d05b4c0ed40107fe2158c5d8527f94568ef
          GTK_PLUGIN_SHA256: cb379f9b0733e9ad9f8bd78f8c2fa038aef2478523bb7d4c8e64ff6a1ea3501a
        run: |
          set -euo pipefail
          cache_dir="${XDG_CACHE_HOME:-$HOME/.cache}/tauri"
          upstream_plugin="$cache_dir/alethe-gtk-upstream.sh"
          mkdir -p "$cache_dir"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/$GTK_PLUGIN_COMMIT/linuxdeploy-plugin-gtk.sh" \
            --output "$upstream_plugin"
          printf '%s  %s\n' "$GTK_PLUGIN_SHA256" "$upstream_plugin" | sha256sum --check
          chmod 0755 "$upstream_plugin"
          install -m 0755 scripts/linuxdeploy-plugin-gtk-wrapper.sh \
            "$cache_dir/linuxdeploy-plugin-gtk.sh"

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura do updater (minisign). Sem estes secrets o build FALHA,
          # porque bundle.createUpdaterArtifacts está ligado. Gere o par com
          # `npm run tauri signer generate` e cadastre nos secrets do repo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Alethe v__VERSION__'
          releaseBody: 'Free desktop build of Alethe for Windows, macOS and Linux. Local app is free; cloud/sync services may be offered separately.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
