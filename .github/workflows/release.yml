name: Release

on:
  # A tag does NOT trigger a release. `npm run release` only stamps the version in
  # git; publishing installers is a deliberate action, through
  # `npm run release:publish` (gh workflow run) or Actions -> Release -> Run workflow.
  workflow_dispatch:

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.label }}
    needs: quality
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows x64
            args: ''
          - platform: ubuntu-22.04
            label: Linux x64
            args: ''
          - platform: macos-latest
            label: macOS Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            label: macOS Intel
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libasound2-dev is ALSA: `cpal` (on-device voice dictation) links against it
          # through alsa-sys, and without it the Linux build panics in its build script.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libspeechd-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # tauri-bundler downloads linuxdeploy into ~/.cache/tauri and reuses whatever is already
      # there. The build it pins (2024-07-29) predates the excludelist entry that keeps
      # libwayland-client out of AppImages (added 2024-11-03), and it does not understand
      # LINUXDEPLOY_EXCLUDED_LIBRARIES either, so seeding a newer one here is what fixes both.
      # Remove this step once tauri-apps/binary-releases ships a build from after 2024-11-03.
      - name: Pin a linuxdeploy that excludes the Wayland libraries
        if: matrix.platform == 'ubuntu-22.04'
        env:
          LINUXDEPLOY_TAG: 1-alpha-20251107-1
          LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/tauri
          curl -fsSL --retry 3 --retry-all-errors -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_TAG}/linuxdeploy-x86_64.AppImage"
          echo "${LINUXDEPLOY_SHA256}  $HOME/.cache/tauri/linuxdeploy-x86_64.AppImage" | sha256sum -c -
          chmod +x ~/.cache/tauri/linuxdeploy-x86_64.AppImage

      - name: Select Xcode 26 (Apple speech recognition)
        if: matrix.platform == 'macos-latest'
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version || true
          swift --version
          SWIFT_VERSION=$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+).*/\1/p' | head -1)
          if [ "$(printf '6.2\n%s\n' "$SWIFT_VERSION" | sort -V | head -1)" != "6.2" ]; then
            echo "::warning::Swift < 6.2 on this runner: the macOS build ships without SpeechAnalyzer (macOS 26 engine)"
          fi

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature (minisign). Without these secrets the build FAILS,
          # because bundle.createUpdaterArtifacts is on. Generate the pair with
          # `npm run tauri signer generate` and register it in the repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Keep the Wayland libraries out of the AppImage — scripts/verify-appimage.sh explains
          # why a bundled one leaves the window blank. libwayland-client is already dropped by
          # the excludelist of the linuxdeploy pinned above; the rest of the ABI family has to
          # be named here. The separator is ";", not ":".
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libwayland-client.so.0;libwayland-cursor.so.0;libwayland-egl.so.1;libwayland-server.so.0"
        with:
          tagName: v__VERSION__
          releaseName: 'Alethe v__VERSION__'
          # Placeholder only. The release-notes job below replaces it with
          # docs/releases/<tag>.md once every platform has finished uploading.
          releaseBody: 'Free desktop build of Alethe for Windows, macOS and Linux. Local app is free; cloud/sync services may be offered separately.'
          # Promoted to a real release at the end of fix-updater-target, once every check ran.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # The step above lives in a tool cache, invisible from the repository: if the cache path
      # or the pinned tool ever changes, the build stays green and ships a broken AppImage —
      # which is exactly how the previous attempt at this fix went unnoticed. This is the part
      # that fails, while the release is still a draft.
      - name: Verify the AppImage bundles no Wayland library
        if: matrix.platform == 'ubuntu-22.04'
        run: ./scripts/verify-appimage.sh

  # The release body written by tauri-action is a single generic line, the same for
  # every version. The real notes live in the repo, one file per version, so they are
  # reviewed in a PR like anything else. A version with no notes file keeps the
  # placeholder instead of failing the release.
  release-notes:
    name: Publish the release notes
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Apply docs/releases/<tag>.md as the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The release is still a draft here; name it the way the other jobs do, not as "the
          # newest release", which a draft left by an earlier failed run could be.
          VERSION="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          NOTES="docs/releases/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::warning::$NOTES not found — keeping the generic release body for $VERSION"
            exit 0
          fi
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$NOTES"
          echo "Release body for $VERSION set from $NOTES"

  # tauri-action picks the Windows bundle for the generic `windows-x86_64` key of
  # latest.json on its own, and it picks the MSI. Almost everyone installs through
  # NSIS (the landing page serves setup.exe), and an MSI applied over an NSIS install
  # neither upgrades it nor restarts the app — the updater closes Alethe and nothing
  # comes back. Here the generic key is repointed at NSIS, without dropping the
  # `-msi` / `-nsis` keys, which stay published.
  fix-updater-target:
    name: Point windows-x86_64 at NSIS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Derived from the same file tauri-action interpolates v__VERSION__ from, so it names the
      # release deterministically and every step below acts on that one. Asking for "the newest
      # draft" instead would happily follow a draft left behind by a failed or concurrent run.
      - name: Resolve the release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" != "true" ]; then
            echo "$VERSION is not a draft release — refusing to touch it" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Draft release: $VERSION"

      - name: Rewrite latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json --clobber

          node <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('latest.json', 'utf8'))
          const nsis = manifest.platforms['windows-x86_64-nsis']
          if (!nsis) {
            console.error('windows-x86_64-nsis missing from latest.json — refusing to rewrite')
            process.exit(1)
          }
          const before = manifest.platforms['windows-x86_64']?.url ?? '(absent)'
          manifest.platforms['windows-x86_64'] = nsis
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2))
          console.log(`windows-x86_64: ${before.split('/').pop()} -> ${nsis.url.split('/').pop()}`)
          NODE

          gh release upload "$VERSION" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify every platform is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output check.json --clobber

          node <<'NODE'
          const manifest = JSON.parse(require('fs').readFileSync('check.json', 'utf8'))
          const required = ['windows-x86_64', 'darwin-x86_64', 'darwin-aarch64', 'linux-x86_64']
          const missing = required.filter((key) => !manifest.platforms[key])
          const unsigned = Object.entries(manifest.platforms)
            .filter(([, value]) => !value.signature)
            .map(([key]) => key)

          for (const [key, value] of Object.entries(manifest.platforms)) {
            console.log(`  ${key.padEnd(22)} ${value.url.split('/').pop()}`)
          }
          if (missing.length) {
            console.error(`\nMissing platforms: ${missing.join(', ')}`)
            process.exit(1)
          }
          if (unsigned.length) {
            console.error(`\nUnsigned platforms: ${unsigned.join(', ')}`)
            process.exit(1)
          }
          if (!manifest.platforms['windows-x86_64'].url.endsWith('.exe')) {
            console.error('\nwindows-x86_64 is not the NSIS installer')
            process.exit(1)
          }
          console.log('\nManifest OK')
          NODE

      # Everything above ran against a draft. Promoting it here is what makes the installers
      # downloadable and what lets the updater see the release, so it must stay last: any
      # earlier step failing leaves the draft unpublished instead of shipping a broken build.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published: $VERSION"

  # Without this, a run that fails the AppImage check leaves its draft behind and nothing ever
  # cleans it up — the next run would then be working around state left by the failed one.
  discard-failed-draft:
    name: Discard the draft of a failed run
    needs: [build, fix-updater-target]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Delete the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          # Deletes a draft only: a published release carrying the same tag is left untouched.
          if [ "$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)" = "true" ]; then
            gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes
            echo "Deleted draft: $VERSION"
          else
            echo "Nothing to discard for $VERSION"
          fi
