name: Release

on:
  # Tag NÃO dispara release. `npm run release` só marca a versão no git;
  # publicar instaladores é uma ação deliberada via `npm run release:publish`
  # (gh workflow run) ou pela aba Actions -> Release -> Run workflow.
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.label }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows x64
            args: ''
          - platform: ubuntu-22.04
            label: Linux x64
            args: ''
          - platform: macos-latest
            label: macOS Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            label: macOS Intel
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura do updater (minisign). Sem estes secrets o build FALHA,
          # porque bundle.createUpdaterArtifacts está ligado. Gere o par com
          # `npm run tauri signer generate` e cadastre nos secrets do repo.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Alethe v__VERSION__'
          releaseBody: 'Free desktop build of Alethe for Windows, macOS and Linux. Local app is free; cloud/sync services may be offered separately.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # O tauri-action escolhe sozinho qual bundle do Windows vai na chave genérica
  # `windows-x86_64` do latest.json, e escolhe o MSI. Quase todo mundo instala
  # pelo NSIS (a landing serve o setup.exe), e um MSI aplicado sobre uma
  # instalação NSIS não faz upgrade dela nem reinicia o app — o updater fecha o
  # Alethe e nada volta. Aqui a chave genérica é reapontada para o NSIS, sem
  # remover as chaves `-msi` / `-nsis`, que continuam publicadas.
  fix-updater-target:
    name: Point windows-x86_64 at NSIS
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Rewrite latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          echo "Release: $VERSION"

          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output latest.json --clobber

          node <<'NODE'
          const fs = require('fs')
          const manifest = JSON.parse(fs.readFileSync('latest.json', 'utf8'))
          const nsis = manifest.platforms['windows-x86_64-nsis']
          if (!nsis) {
            console.error('windows-x86_64-nsis missing from latest.json — refusing to rewrite')
            process.exit(1)
          }
          const before = manifest.platforms['windows-x86_64']?.url ?? '(absent)'
          manifest.platforms['windows-x86_64'] = nsis
          fs.writeFileSync('latest.json', JSON.stringify(manifest, null, 2))
          console.log(`windows-x86_64: ${before.split('/').pop()} -> ${nsis.url.split('/').pop()}`)
          NODE

          gh release upload "$VERSION" latest.json --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify every platform is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern latest.json --output check.json --clobber

          node <<'NODE'
          const manifest = JSON.parse(require('fs').readFileSync('check.json', 'utf8'))
          const required = ['windows-x86_64', 'darwin-x86_64', 'darwin-aarch64', 'linux-x86_64']
          const missing = required.filter((key) => !manifest.platforms[key])
          const unsigned = Object.entries(manifest.platforms)
            .filter(([, value]) => !value.signature)
            .map(([key]) => key)

          for (const [key, value] of Object.entries(manifest.platforms)) {
            console.log(`  ${key.padEnd(22)} ${value.url.split('/').pop()}`)
          }
          if (missing.length) {
            console.error(`\nMissing platforms: ${missing.join(', ')}`)
            process.exit(1)
          }
          if (unsigned.length) {
            console.error(`\nUnsigned platforms: ${unsigned.join(', ')}`)
            process.exit(1)
          }
          if (!manifest.platforms['windows-x86_64'].url.endsWith('.exe')) {
            console.error('\nwindows-x86_64 is not the NSIS installer')
            process.exit(1)
          }
          console.log('\nManifest OK')
          NODE
